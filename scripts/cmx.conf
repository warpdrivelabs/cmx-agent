# ======================================================================
# CMX 平台反向代理（deploy 栈：portal + 7 引擎，见 ~/apps/cmx-deploy/）
# 规范：本文件只放 CMX 相关配置；nginx.conf 主文件保持发行版默认。
# 端口约定：80 = 已停用（默认站点未启用）；
#           8086 = CMX 全套反代（唯一监听端口），各服务统一挂服务名前缀 /<svc>/。
# ======================================================================

# websocket 升级连接映射（配合下方 Connection 头）
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# 智能体更新通道的原始协议判定：本机 80 停用，凡 Host=公网域名的请求必经外层 443
# （https）而来；内网直连 IP:8086 的保持 http。门户按此头把 latest.json 的下载地址
# 改写成正确协议（缺此头门户默认 http，浏览器对 https 页面里的 http 下载会拦截）。
map $host $agent_update_proto {
	cmx.pansoft.com  https;
	default          http;
}

# ---- gzip：压缩类型按代理场景配置（nginx.conf 已有 gzip on，此处不再重复） ----
gzip_vary on;
gzip_proxied any;            # 反代响应也压缩（默认 off，代理场景必须开）
gzip_comp_level 5;
gzip_min_length 1k;
gzip_http_version 1.1;
gzip_types text/plain text/css text/javascript
	application/javascript application/x-javascript application/json
	application/xml application/xml+rss image/svg+xml application/wasm;

server_tokens off;

# ---- 上游：与 deploy.sh 的 SVC_PORT 一致（8080/8091-8095/8097/8098） ----
upstream cmx_portal   { server 127.0.0.1:8080; }   # 门户主应用
upstream cmx_flow     { server 127.0.0.1:8091; }   # 流程引擎
upstream cmx_report   { server 127.0.0.1:8092; }   # 报表引擎
upstream cmx_model    { server 127.0.0.1:8093; }   # 模型微服务
upstream cmx_rules    { server 127.0.0.1:8094; }   # 规则引擎
upstream cmx_mdm      { server 127.0.0.1:8095; }   # 主数据治理
upstream cmx_onto     { server 127.0.0.1:8097; }   # 本体平台
upstream cmx_dataauth { server 127.0.0.1:8098; }   # 数据权限（已暂停，启动后路由自动生效）

server {
	listen 8086 default_server;
	listen [::]:8086 default_server;
	server_name _;

	client_max_body_size 200m;   # 附件 / 插件包上传

	# 服务名不带斜杠 → 301 补全（/portal → /portal/）
	location ~ ^/(portal|portalmanager|flow|report|model|rules|mdm|onto|dataauth)$ {
		return 301 /$1/;
	}

	# ---- 门户（8080，前缀保留：portal 原生按 /portal、/api、/html、/shared 发布） ----
	location /portal/ { include snippets/cmx-proxy.conf; proxy_pass http://cmx_portal; }
	location /api/    { include snippets/cmx-proxy.conf; proxy_pass http://cmx_portal; }
	location /html/   { include snippets/cmx-proxy.conf; proxy_pass http://cmx_portal; }
	location /shared/ { include snippets/cmx-proxy.conf; proxy_pass http://cmx_portal; }

	# ---- 智能体自动更新（tauri-plugin-updater 边缘通道：根级路径免鉴权）----
	# 自包含不走 snippets：避免与 snippet 内的同名 proxy_set_header 叠加发两个头
	# （门户取第一个，会盖掉下方按域名判定的 X-Forwarded-Proto）。agent-updates
	# 只需 Host（改写下载地址用），无需 snippet 的其余头。
	# gzip 必须关：客户端 reqwest 未启用 gzip 解压（updater 2.11.0 default-features=false），
	# latest.json 被压缩后客户端解析必挂。
	location /agent-updates/ {
		gzip off;
		proxy_pass http://cmx_portal;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $agent_update_proto;
	}

	# 门户管理端别名：/portalmanager/xxx → 8080/xxx（去前缀；8080 根挂的就是 portal-manager 前端，资源为相对引用）
	location /portalmanager/ { include snippets/cmx-proxy.conf; proxy_pass http://cmx_portal/; }

	# ---- 各引擎直连（去前缀：/flow/xxx → 8091/xxx），监控大盘、swagger、SSE 免改路径 ----
	location /flow/     { include snippets/cmx-proxy.conf; proxy_pass http://cmx_flow/; }
	location /report/   { include snippets/cmx-proxy.conf; proxy_pass http://cmx_report/; }
	location /model/    { include snippets/cmx-proxy.conf; proxy_pass http://cmx_model/; }
	location /rules/    { include snippets/cmx-proxy.conf; proxy_pass http://cmx_rules/; }
	location /mdm/      { include snippets/cmx-proxy.conf; proxy_pass http://cmx_mdm/; }
	location /onto/     { include snippets/cmx-proxy.conf; proxy_pass http://cmx_onto/; }
	location /dataauth/ { include snippets/cmx-proxy.conf; proxy_pass http://cmx_dataauth/; }

	# ---- 其余路径 = 静态默认站（与 nginx 原行为一致） ----
	location / {
		root /var/www/html;
		index index.html;
	}
}
