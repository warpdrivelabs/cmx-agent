[package]
name = "cmx-agent-net"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "cmx-agent 联网研究（U10）：web_fetch 抓网页取正文 + web_search 网络搜索。重依赖 reqwest 隔离于本 crate"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
cmx-agent-core.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
# HTTP 客户端：版本/特性对齐 cmx-agent-model，复用离线缓存与已编译特性集
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
# U8 浏览器：子进程调本机 Chrome（tokio::process + timeout）
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
