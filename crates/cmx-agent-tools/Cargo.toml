[package]
name = "cmx-agent-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "cmx-agent 内置工具：echo/clock/add/fs_read（工具平面示例，后续接 cmx-* 引擎与 MCP）"

[dependencies]
cmx-agent-core.workspace = true
cmx-agent-sandbox.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
chrono.workspace = true
tokio.workspace = true
# 编码面（E1）：grep 用 regex，遍历用 walkdir，glob 用 glob。版本对齐 cmx-container 根，复用离线缓存。
regex = "1"
walkdir = "2.5"
glob = "0.3"
# 办公面（P3/U7）：数据分析用 csv 解析。已离线缓存 1.4。图表用手写 SVG（无额外依赖）。
csv = "1.4"

[target.'cfg(windows)'.dependencies]
# Job Object 进程树收尸（Windows 适配方案 P1.5）。0.59 取自离线缓存（mio/socket2 链已有）。
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading", # JOBOBJECT_EXTENDED_LIMIT_INFORMATION 结构体门控
    "Win32_Security",         # CreateJobObjectW 的 SECURITY_ATTRIBUTES 参数门控
    "Win32_Foundation",
] }

[dev-dependencies]
tokio = { workspace = true }
