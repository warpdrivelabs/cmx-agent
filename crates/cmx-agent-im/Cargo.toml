[package]
name = "cmx-agent-im"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "cmx-agent IM 遥控（U9）：把 IM 会话桥接到 AgentApp（收消息→跑回合→回复）。transport 无关 + Telegram 参考 provider"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
cmx-agent-app.workspace = true
cmx-agent-core.workspace = true
cmx-agent-connectors.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio = { workspace = true }
tracing.workspace = true
# IM HTTP provider（Telegram/自建网关）：版本/特性对齐 cmx-agent-model，复用离线缓存
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 飞书 Stream（长连接）：websocket 客户端，rustls 免系统 TLS 依赖。拉取失败见计划「风险与退路」。
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# 微信 ClawBot（iLink）：QR data-url / X-WECHAT-UIN 编码（lock 已有 0.22.1，离线缓存命中）
base64 = "0.22"
# 微信 ClawBot（iLink）：X-WECHAT-UIN 防重放随机数（lock 已有 0.2.17，离线缓存命中）
getrandom = "0.2"
# QQ 机器人扫码绑定：q.qq.com 下发的 AppSecret 为 AES-256-GCM 密文（aes-gcm-0.10.3 离线缓存命中）
aes-gcm = "0.10"

[dev-dependencies]
