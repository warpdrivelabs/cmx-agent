<!DOCTYPE html>
<!-- cmx-agent Web 桌面壳前端。两栏布局（对齐 WorkBuddy）：左侧栏(品牌/新建/导航/会话列表/用户) + 主区(首页引导 ↔ 会话)。
     所有后端交互经 POST /api → dispatch_json（= Tauri invoke 的 HTTP 版）。占位区标注「占位」，真实区接后端。 -->
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cmx 企业桌面智能体</title>
<style>
  :root{
    --bg:#0d0d0d; --panel:#141414; --panel2:#1a1a19; --surface:#1e1e1d; --hover:#242423;
    --ink:#f2f1ec; --ink2:#b8b7ae; --muted:#7d7c76; --border:#2a2a28; --border2:#333330;
    --blue:#3987e5; --aqua:#1fb182; --violet:#9085e9; --magenta:#d55181; --orange:#eb6834;
    --green:#22c55e; --red:#e5605f; --accent:#1fb182;
    --accent-soft:#17362b;
    --header-h:36px;
    --aside-w:270px;
  }
  /* 浅色主题（dataviz light 令牌）——由标题栏主题开关切换 html[data-theme] */
  html[data-theme="light"]{
    --bg:#f4f4f2; --panel:#ffffff; --panel2:#f7f7f5; --surface:#ffffff; --hover:#ececea;
    --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --border:#e4e3dc; --border2:#d6d5ce;
    --blue:#2a78d6; --aqua:#1baf7a; --violet:#4a3aa7; --magenta:#e87ba4; --orange:#eb6834;
    --green:#0ca30c; --red:#e34948; --accent:#1baf7a; --accent-soft:#e3f5ee;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;overflow:hidden;font-size:14px}
  /* 顶部工作区（活动栏 + 侧栏 + 主区）在原生标题条之下 */
  .workspace{flex:1;display:flex;min-height:0}

  /* ── 最左活动栏（VSCode 式）：Agent / 即时通讯 / 插件管理 ── */
  .activitybar{width:52px;flex:0 0 52px;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px}
  .act{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:20px;color:var(--muted);position:relative;background:transparent}
  .act:hover{background:var(--hover);color:var(--ink)}
  .act.active{color:var(--aqua)}
  .act.active::before{content:"";position:absolute;left:-8px;top:9px;width:3px;height:22px;border-radius:2px;background:var(--aqua)}
  .act .badge{position:absolute;top:5px;right:5px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
    background:var(--red);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .act-sp{flex:1}
  /* 活动栏底部 cmx 按钮（图片） */
  .cmx-act{padding:0;overflow:hidden}
  .cmx-act img{width:30px;height:30px;border-radius:8px;object-fit:cover;display:block}
  .cmx-act:hover{background:var(--hover)}
  /* 活动栏底部用户头像按钮 */
  .user-act{padding:0}
  .user-act .uic{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--aqua),var(--green));
    display:flex;align-items:center;justify-content:center;font-size:16px}
  .user-act:hover{background:var(--hover)}
  /* 用户菜单头部 */
  .usermenu{min-width:220px;bottom:52px}
  .um-head{display:flex;align-items:center;gap:10px;padding:8px 9px}
  .um-av{width:40px;height:40px;border-radius:50%;flex:0 0 40px;background:linear-gradient(135deg,var(--aqua),var(--green));
    display:flex;align-items:center;justify-content:center;font-size:20px}
  .um-info{min-width:0}
  .um-name{font-weight:700;font-size:14px} .um-mail{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .um-danger{color:var(--red)} .um-danger:hover{background:rgba(227,73,72,.12)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

  /* 原生标题条：贯穿窗口顶部一整行，与系统交通灯同一行（Overlay 标题栏）。
     整条可拖动（app-region: drag）；左侧留 78px 给交通灯；右侧放控件（控件本身设 no-drag）。 */
  .titlebar{height:32px;flex:0 0 32px;display:flex;align-items:center;
    background:var(--panel);border-bottom:1px solid var(--border);
    padding:0 10px 0 82px;-webkit-app-region:drag;user-select:none}
  .titlebar .tb-title{font-size:12.5px;color:var(--muted);font-weight:600}
  .titlebar .sp{flex:1}
  .tb-ctrls{display:flex;align-items:center;gap:3px;-webkit-app-region:no-drag}
  .tb-btn{display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:7px;color:var(--ink2);
    font-size:12.5px;background:transparent;border:1px solid transparent}
  .tb-btn:hover{background:var(--hover);color:var(--ink);border-color:var(--border)}
  .tb-btn .ico{font-size:14px;line-height:1}
  .tb-update{color:var(--aqua)} .tb-update:hover{border-color:var(--aqua)}
  /* 侧栏折叠 */
  body.sidebar-collapsed aside{display:none}

  /* ── 左侧栏 ── */
  aside{width:var(--aside-w);flex:0 0 var(--aside-w);background:var(--panel);
    display:flex;flex-direction:column;padding:0 10px;position:relative}
  /* 左右分栏拖动条：单条分隔线（取代 aside 右边框），中间有可拖动手柄 */
  .splitter{flex:0 0 6px;align-self:stretch;cursor:col-resize;position:relative;z-index:5;background:transparent}
  .splitter::before{content:"";position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:1px;background:var(--border)}
  .splitter::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:4px;height:34px;border-radius:3px;background:var(--border2);transition:background .15s,height .15s}
  .splitter:hover::after,.splitter.dragging::after{background:var(--aqua);height:52px}
  body.sidebar-collapsed .splitter{display:none}
  /* 三面板：同一时刻只显示一个 */
  .panel{display:none;flex-direction:column;flex:1;min-height:0}
  .panel.on{display:flex}
  /* IM / 插件 面板共用件 */
  .im-search{padding:8px 4px}
  .im-search input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:9px;
    padding:8px 11px;color:var(--ink);font-size:13px;outline:none;font-family:inherit}
  .im-search input:focus{border-color:var(--aqua)}
  .im-list,.plug-list{flex:1;overflow:auto;margin:0 -4px}
  /* Telegram 式会话行 */
  .im-item{display:flex;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer}
  .im-item:hover{background:var(--hover)}
  .im-item .av{width:40px;height:40px;border-radius:50%;flex:0 0 40px;display:flex;align-items:center;justify-content:center;
    font-size:19px;color:#fff}
  .im-item .mid{flex:1;min-width:0}
  .im-item .r1{display:flex;align-items:center;gap:6px} .im-item .nm{font-weight:600;font-size:13.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .im-item .tm{font-size:11px;color:var(--muted);flex:0 0 auto}
  .im-item .r2{display:flex;align-items:center;gap:6px;margin-top:2px}
  .im-item .msg{flex:1;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .im-item .unread{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--aqua);color:#fff;
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  /* VSCode 式插件行 */
  .plug-sec{font-size:11px;font-weight:700;color:var(--muted);padding:12px 8px 5px;letter-spacing:.5px}
  .plug-item{display:flex;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer}
  .plug-item:hover{background:var(--hover)}
  .plug-item .pic{width:38px;height:38px;border-radius:9px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;
    font-size:19px;color:#fff}
  .plug-item .pm{flex:1;min-width:0}
  .plug-item .pn{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plug-item .pd{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .plug-item .pmeta{font-size:11px;color:var(--muted);margin-top:3px}
  .plug-item .pbtn{align-self:center;font-size:11.5px;padding:4px 10px;border-radius:7px;border:1px solid var(--border2);color:var(--ink2);flex:0 0 auto}
  .plug-item .pbtn.installed{color:var(--aqua);border-color:var(--aqua)}
  .plug-item .pbtn:hover{background:var(--hover)}
  .brand{display:flex;align-items:center;gap:9px;height:var(--header-h);box-sizing:border-box;
    margin:0 -10px;padding:0 14px;border-bottom:1px solid var(--border)}
  .brand .uav{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--aqua),var(--green));
    display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 26px}
  .brand .uname{font-weight:700;font-size:14px} .brand .v{color:var(--muted);font-size:11px;margin-left:auto;font-weight:400}
  .newbtn{display:flex;align-items:center;gap:9px;width:100%;padding:11px 12px;border-radius:10px;
    background:var(--surface);border:1px solid var(--border2);font-weight:600;font-size:14px;margin:12px 0 8px}
  .newbtn:hover{background:var(--hover)} .newbtn .plus{font-size:17px;color:var(--aqua)}
  nav{display:flex;flex-direction:column;gap:1px}
  .navitem{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--ink2);font-size:14px}
  .navitem:hover{background:var(--hover);color:var(--ink)} .navitem .i{width:17px;text-align:center;opacity:.85}
  .navitem .tag{margin-left:auto;font-size:11px;color:var(--muted)}
  .seclabel{color:var(--muted);font-size:12px;font-weight:600;padding:14px 12px 6px;display:flex;align-items:center;gap:6px}
  .seclabel .c{color:var(--ink2)}
  .tasklist{flex:1;overflow:auto;margin:0 -2px}
  .task{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:var(--ink2);font-size:13.5px}
  .task:hover{background:var(--hover);color:var(--ink)} .task.active{background:var(--surface);color:var(--ink)}
  .task .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task .tm{font-size:11px;color:var(--muted);flex:0 0 auto}
  .task .del{opacity:0;color:var(--muted);font-size:14px;padding:0 2px} .task:hover .del{opacity:.7} .task .del:hover{color:var(--red);opacity:1}
  .empty-tasks{color:var(--muted);font-size:12.5px;padding:10px 12px;line-height:1.7}
  .promo{margin:8px -2px 8px;padding:12px;border-radius:10px;background:linear-gradient(135deg,#12241d,#0f1a17);
    border:1px solid var(--border2);position:relative}
  .promo .x{position:absolute;top:8px;right:10px;color:var(--muted);font-size:13px}
  .promo .pt{font-weight:600;font-size:13px;margin-bottom:3px} .promo .ps{color:var(--ink2);font-size:12px}
  .promo .ps b{color:var(--green)} .promo .pb{margin-top:9px;padding:6px 12px;border-radius:7px;background:#fff;color:#111;font-weight:700;font-size:12px}
  .userbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);margin:0 -10px;position:relative}
  .cmxbtn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;overflow:hidden;padding:0}
  .cmxbtn:hover{filter:brightness(1.08)} .cmxbtn img{width:100%;height:100%;object-fit:cover;display:block}
  .userbar .ic-group{margin-left:auto;display:flex;align-items:center;gap:4px}
  .userbar .ic{color:var(--muted);font-size:15px;padding:4px 5px;border-radius:7px} .userbar .ic:hover{color:var(--ink);background:var(--hover)}
  /* cmx 功能菜单（点左下 cmx 按钮弹出） */
  .cmxmenu{position:fixed;left:56px;bottom:10px;min-width:180px;background:var(--panel);
    border:1px solid var(--border2);border-radius:10px;padding:5px;box-shadow:0 8px 28px rgba(0,0,0,.35);
    display:none;z-index:60}
  .cmxmenu.on{display:block}
  .cmxmenu .mi{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;font-size:13.5px;color:var(--ink2)}
  .cmxmenu .mi:hover{background:var(--hover);color:var(--ink)}
  .cmxmenu .mi-i{width:16px;text-align:center;font-size:14px}
  .cmxmenu .mi-sep{height:1px;background:var(--border);margin:5px 8px}

  /* ── 主区 ── */
  main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  /* ── 顶部多 tab 条 ── */
  .tabbar{display:flex;align-items:stretch;height:var(--header-h);box-sizing:border-box;border-bottom:1px solid var(--border);background:var(--panel)}
  .tabstrip{flex:1;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden}
  .tabstrip::-webkit-scrollbar{height:0}
  .tab{display:flex;align-items:center;gap:7px;padding:0 9px 0 13px;max-width:200px;border-right:1px solid var(--border);
    color:var(--ink2);font-size:13px;cursor:pointer;position:relative;flex:0 0 auto;background:transparent}
  .tab:hover{background:var(--hover)}
  .tab.active{background:var(--bg);color:var(--ink)}
  .tab.active::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--aqua)}
  .tab .tab-ico{font-size:13px;flex:0 0 auto}
  .tab .tab-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tab .tab-x{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--muted);flex:0 0 auto;opacity:.6}
  .tab .tab-x:hover{background:var(--border2);color:var(--ink);opacity:1}
  .tab-overflow{width:36px;flex:0 0 36px;border-left:1px solid var(--border);color:var(--ink2);font-size:15px}
  .tab-overflow:hover{background:var(--hover);color:var(--ink)}
  .tab-dropdown{position:absolute;top:calc(var(--header-h) + 4px);right:14px;min-width:220px;max-height:60vh;overflow:auto;
    background:var(--panel);border:1px solid var(--border2);border-radius:10px;padding:5px;box-shadow:0 8px 28px rgba(0,0,0,.35);display:none;z-index:60}
  .tab-dropdown.on{display:block}
  .tab-dd-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--ink2);cursor:pointer}
  .tab-dd-item:hover{background:var(--hover);color:var(--ink)} .tab-dd-item.active{color:var(--aqua)}
  .tab-dd-item .ddx{margin-left:auto;color:var(--muted);opacity:.6} .tab-dd-item .ddx:hover{color:var(--red);opacity:1}
  /* tab 右键菜单复用 .cmxmenu，但用固定定位（JS 设 left/top）*/
  .tabctx{position:fixed;bottom:auto}

  /* 空态默认内容（无 tab 时显示）*/
  #home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px;overflow:auto}
  #home.off{display:none}
  #home .hero{font-size:34px;font-weight:700;margin-bottom:26px;text-align:center;letter-spacing:1px}
  #home .hero .g{background:linear-gradient(90deg,var(--aqua),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
  .cats{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
  .cat{display:flex;align-items:center;gap:7px;padding:9px 18px;border-radius:22px;background:var(--surface);
    border:1px solid var(--border2);color:var(--ink2);font-size:14px}
  .cat.active{background:var(--accent-soft);border-color:var(--aqua);color:var(--aqua);font-weight:600}
  .cat:hover{background:var(--hover)}
  .quick{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;justify-content:center;max-width:820px}
  .qa{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--panel2);
    border:1px solid var(--border);color:var(--ink2);font-size:13.5px}
  .qa:hover{background:var(--hover);color:var(--ink);border-color:var(--border2)}
  .composer{width:100%;max-width:820px;background:var(--panel2);border:1px solid var(--border2);border-radius:16px;padding:16px 18px}
  .composer.big{min-height:150px;display:flex;flex-direction:column}
  #inp{width:100%;background:none;border:none;outline:none;color:var(--ink);font-size:15px;resize:none;
    font-family:inherit;line-height:1.5;flex:1;min-height:64px}
  #inp::placeholder{color:var(--muted)}
  .composer .crow{display:flex;align-items:center;margin-top:10px;gap:10px}
  .composer .add{width:30px;height:30px;border-radius:8px;background:var(--surface);color:var(--ink2);font-size:17px;
    display:flex;align-items:center;justify-content:center} .composer .add:hover{background:var(--hover)}
  .composer .sp{flex:1}
  .composer .model{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px;padding:6px 10px;border-radius:8px}
  .composer .model:hover{background:var(--hover)}
  .composer .send{width:34px;height:34px;border-radius:50%;background:var(--surface);color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:15px}
  .composer .send:hover{background:var(--aqua);color:#052} .composer .send:disabled{opacity:.4}
  .selectors{display:flex;gap:14px;margin-top:12px;max-width:820px;width:100%}
  .selbtn{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;color:var(--ink2);font-size:13px;border:1px solid transparent}
  .selbtn:hover{background:var(--panel2);border-color:var(--border)}
  .selbtn select{background:none;border:none;color:var(--ink2);font-family:inherit;font-size:13px;outline:none;cursor:pointer}
  .selbtn select option{background:var(--panel2)}

  /* 会话态 */
  /* tab 内容容器：每个 tab 一个 .tabview，只 active 的显示 */
  #tabviews{flex:1;display:none;min-height:0}
  #tabviews.on{display:block}
  .tabview{display:none;height:100%;flex-direction:column;min-height:0}
  .tabview.active{display:flex}
  .session-view{flex:1;display:flex;flex-direction:column;min-height:0}
  .log{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:11px}
  .row{display:flex;gap:10px}
  .row.user{align-self:flex-end;flex-direction:row-reverse;max-width:80%}
  /* AI 气泡撑满该行（与工具卡片同宽），使整列内容左对齐、右边界一致；用户气泡仍随内容收缩 */
  .row:not(.user){align-self:stretch}
  .row:not(.user) .bubble{flex:1 1 auto;min-width:0}
  .avatar{width:30px;height:30px;border-radius:8px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
  .avatar.u{background:var(--magenta)} .avatar.a{background:var(--blue)}
  .bubble{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  /* markdown 气泡：内部用块级排版，不再 pre-wrap（由各元素自管）*/
  .bubble.md{white-space:normal}
  .bubble.md>:first-child{margin-top:0} .bubble.md>:last-child{margin-bottom:0}
  .bubble.md .md-h{margin:14px 0 8px;line-height:1.3;font-weight:700}
  .bubble.md h1.md-h{font-size:20px} .bubble.md h2.md-h{font-size:18px;border-bottom:1px solid var(--border);padding-bottom:5px}
  .bubble.md h3.md-h{font-size:16px} .bubble.md h4.md-h{font-size:14.5px} .bubble.md h5.md-h,.bubble.md h6.md-h{font-size:13.5px;color:var(--ink2)}
  .bubble.md .md-p{margin:8px 0}
  .bubble.md .md-ul,.bubble.md .md-ol{margin:8px 0;padding-left:22px} .bubble.md .md-ul li,.bubble.md .md-ol li{margin:3px 0}
  .bubble.md .md-quote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--aqua);color:var(--ink2);background:var(--panel2);border-radius:0 8px 8px 0}
  .bubble.md .md-hr{border:none;border-top:1px solid var(--border);margin:12px 0}

<body>
  <!-- ═════ 原生标题条：与系统交通灯同一行（Overlay）。左留交通灯位，右侧控件 ═════ -->

<script>
// ── 后端桥：同核多壳。原生 Tauri 壳走 invoke("agent")，Web 壳回退 HTTP POST /api。两者同达 dispatch_json。 ──
async function call(req){
  if (window.__TAURI__ && window.__TAURI__.core){
    const raw = await window.__TAURI__.core.invoke("agent", { payload: JSON.stringify(req) });
    return JSON.parse(raw);
  }
  const r = await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(req)});
  return await r.json();
}
// ── 流式对话桥（同核多壳）：原生 Tauri 壳走 invoke("send_stream")+事件；Web 壳走 POST /api/stream 的 SSE。──
// onEvent 收到每个会话事件（含终止标记 {kind:"stream_done"} / {kind:"stream_error",message}）。
async function streamSend(sessionId, text, onEvent){
  if (window.__TAURI__ && window.__TAURI__.core){
    const chan = "agentstream-" + Date.now() + "-" + Math.random().toString(36).slice(2,8);
    const un = await window.__TAURI__.event.listen(chan, e => onEvent(e.payload));
    try { await window.__TAURI__.core.invoke("send_stream", { sessionId, text, channel: chan }); }
    finally { un(); }
    return;
  }
  // Web：fetch + ReadableStream 手动解析 SSE（\n\n 分帧，取 data: 行）
  const r = await fetch("/api/stream", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({session_id:sessionId, text})});
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
  while(true){
    const {value, done} = await reader.read(); if(done) break;
    buf += dec.decode(value, {stream:true});
    let idx;
    while((idx = buf.indexOf("\n\n")) >= 0){
      const frame = buf.slice(0, idx); buf = buf.slice(idx+2);
      const dline = frame.split("\n").find(l => l.startsWith("data:"));
      if(!dline) continue;
      try { onEvent(JSON.parse(dline.slice(5).trim())); } catch(e){}
    }
  }
}
function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function el(cls,html){ const d=document.createElement("div"); d.className=cls; if(html!=null)d.innerHTML=html; return d; }

// ══════════════ 多 tab 系统 ══════════════
// 每个 tab 保留独立 DOM 状态（像浏览器）。TABS 里存 {id,kind,title,ico,view,extra}
// kind: "session"（会话，view 含独立 log+composer）/ "connectors"（连接器卡片）
let TABS = [];
let ACTIVE = null;      // 当前 active tab 的 id
let CURRENT = null;     // 当前 active 的会话 id（供任务列表高亮/发送；非会话 tab 时为 null）
const tabviews = ()=>document.getElementById("tabviews");
const homeEl = ()=>document.getElementById("home");

function findTab(id){ return TABS.find(t=>t.id===id); }

// 渲染顶部 tab 条
function renderTabs(){
  const strip=document.getElementById("tabstrip"); strip.innerHTML="";
  TABS.forEach(t=>{
    const el=document.createElement("div");
    el.className="tab"+(t.id===ACTIVE?" active":"");
    el.dataset.tabid=t.id;
    el.innerHTML=`<span class="tab-ico">${t.ico}</span><span class="tab-t">${esc(t.title)}</span><span class="tab-x" title="关闭">✕</span>`;
    el.onclick=(e)=>{ if(e.target.classList.contains("tab-x")){ closeTab(t.id); } else { activateTab(t.id); } };
    el.oncontextmenu=(e)=>{ e.preventDefault(); openTabCtx(e, t.id); };
    strip.append(el);
  });
  // 显示逻辑：home(新建任务) 与 tabviews 按「是否有激活 tab」切换；tab 条只要有 tab 就显示。
  // 关键：ACTIVE==null 表示「新建任务」态——即使已有 tab，也显示 home 内容（tab 条仍在，便于切回）。
  const hasTabs=TABS.length>0;
  const inTab=ACTIVE!==null;
  homeEl().classList.toggle("off", inTab);
  tabviews().classList.toggle("on", inTab);
  document.getElementById("tabbar").style.display = hasTabs ? "" : "none";
}

// 激活某 tab：只显示它的 view
function activateTab(id){
  ACTIVE=id;
  TABS.forEach(t=>t.view.classList.toggle("active", t.id===id));
  const t=findTab(id);
  CURRENT = (t && t.kind==="session") ? t.sessionId : null;
  renderTabs();
  if(t && t.kind==="session"){ const inp=t.view.querySelector(".inp2"); if(inp) inp.focus(); }
}

// 打开或聚焦一个 tab
function openTab({id, kind, title, ico, sessionId}){
  let t=findTab(id);
  if(t){ activateTab(id); return t; }
  const view=document.createElement("div"); // 会被模板内容替换
  t={id, kind, title, ico, sessionId, view};
  TABS.push(t);
  tabviews().append(view);
  return t;
}

// 关闭一个 tab
function closeTab(id){
  const idx=TABS.findIndex(t=>t.id===id); if(idx<0) return;
  const t=TABS[idx]; t.view.remove(); TABS.splice(idx,1);
  if(ACTIVE===id){
    // 激活相邻 tab
    const next=TABS[idx] || TABS[idx-1];
    if(next) activateTab(next.id); else { ACTIVE=null; CURRENT=null; renderTabs(); document.getElementById("inp").focus(); }
  } else { renderTabs(); }
  refreshTasks();
}
function closeOthers(id){ TABS.filter(t=>t.id!==id).map(t=>t.id).forEach(closeTab); activateTab(id); }
function closeRight(id){ const idx=TABS.findIndex(t=>t.id===id); TABS.slice(idx+1).map(t=>t.id).forEach(closeTab); }
function closeAll(){ TABS.map(t=>t.id).forEach(closeTab); }

// tab 溢出下拉
function toggleTabOverflow(){
  const dd=document.getElementById("tab-dropdown");
  if(dd.classList.contains("on")){ dd.classList.remove("on"); return; }
  dd.innerHTML="";
  TABS.forEach(t=>{
    const it=el("tab-dd-item"+(t.id===ACTIVE?" active":""));
    it.innerHTML=`<span>${t.ico}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.title)}</span><span class="ddx">✕</span>`;
    it.onclick=(e)=>{ if(e.target.classList.contains("ddx")){ closeTab(t.id); toggleTabOverflow(); } else { activateTab(t.id); dd.classList.remove("on"); } };
    dd.append(it);
  });
  if(TABS.length===0) dd.append(el("tab-dd-item","（没有打开的标签页）"));
  dd.classList.add("on");
}

// tab 右键上下文菜单
let CTX_TAB=null;
function openTabCtx(e, id){
  CTX_TAB=id;
  const m=document.getElementById("tabctx");
  m.style.left=e.clientX+"px"; m.style.top=e.clientY+"px";
  m.classList.add("on");
}
function closeTabCtx(){ document.getElementById("tabctx").classList.remove("on"); }
function tabCtxClose(){ closeTabCtx(); if(CTX_TAB) closeTab(CTX_TAB); }
function tabCtxCloseOthers(){ closeTabCtx(); if(CTX_TAB) closeOthers(CTX_TAB); }
function tabCtxCloseRight(){ closeTabCtx(); if(CTX_TAB) closeRight(CTX_TAB); }
function tabCtxCloseAll(){ closeTabCtx(); closeAll(); }

// 快捷动作（点击=预填输入框）。占位示例，贴合 WorkBuddy 品类。
const QUICK = ["📄 文档处理","💳 金融服务","📊 数据分析及可视化","🧰 个人工作台","🔍 深度研究"];
const quickEl = document.getElementById("quick");
QUICK.forEach(q=>{ const b=el("button","<span>"+q+"</span>"); b.className="qa"; b.title="点击预填指令（占位示例）";
  b.onclick=()=>{ document.getElementById("inp").value = q.replace(/^\S+\s/,"")+"："; document.getElementById("inp").focus(); };
  quickEl.append(b); });

// ── 侧栏会话列表（真实：list_sessions）──
async function refreshTasks(){
  const resp = await call({cmd:"list_sessions"});
  const list = (resp.ok && resp.data.sessions) || [];
  document.getElementById("taskcount").textContent = "("+list.length+")";
  const box = document.getElementById("tasklist"); box.innerHTML="";
  if(list.length===0){ box.append(el("empty-tasks","还没有任务。<br>点上方「新建任务」或在首页直接下达指令。")); return; }
  list.forEach(m=>{
    const t=el("task"+(m.id===CURRENT?" active":""));
    t.innerHTML = `<span class="tt">${esc(m.title||m.id)}</span><span class="tm">${ago(m.updated_at)}</span><span class="del" title="删除">✕</span>`;
    t.querySelector(".tt").onclick = ()=>openSession(m.id);
    t.querySelector(".del").onclick = async (e)=>{ e.stopPropagation(); await call({cmd:"delete_session",session_id:m.id});
      if(findTab("s:"+m.id)) closeTab("s:"+m.id); refreshTasks(); };
    box.append(t);
  });
}
function ago(iso){ const d=(Date.now()-new Date(iso).getTime())/86400000;
  if(d<1) return "今天"; if(d<2) return "昨天"; return Math.floor(d)+"天前"; }

// ── 轻量 Markdown 渲染（块级 + 行内）：标题/列表/表格/代码块/引用/粗斜体/行内代码/链接 ──
// 安全：所有文本经 esc() 转义后再套标签，模型输出的原始 HTML 一律当文本（避免注入）。
function mdInline(t){
  return esc(t)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g,'<del>$1</del>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderMarkdown(src){
  if(!src) return "";
  const lines=String(src).replace(/\r\n/g,"\n").split("\n");
  const out=[]; let i=0;
  const isSpecial=(l)=> /^(#{1,6}\s|```|>\s?|\s*[-*+]\s|\s*\d+\.\s|(-{3,}|\*{3,}|_{3,})\s*$)/.test(l);
  while(i<lines.length){
    let line=lines[i];
    if(/^```/.test(line)){                                   // 代码块
      const buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++; out.push('<pre class="md-pre"><code>'+esc(buf.join("\n"))+'</code></pre>'); continue;
    }
    const h=line.match(/^(#{1,6})\s+(.*)$/);                 // 标题
    if(h){ const n=h[1].length; out.push(`<h${n} class="md-h">`+mdInline(h[2])+`</h${n}>`); i++; continue; }
    if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){ out.push('<hr class="md-hr">'); i++; continue; }  // 分隔线
    // 表格：本行含 | 且下一行是 |---| 分隔
    if(line.includes("|") && i+1<lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]) && lines[i+1].includes("-")){
      const row=(l)=> l.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
      const heads=row(line); i+=2; const body=[];
      while(i<lines.length && lines[i].includes("|") && lines[i].trim()!==""){ body.push(row(lines[i])); i++; }
      let tb='<table class="md-table"><thead><tr>'+heads.map(c=>'<th>'+mdInline(c)+'</th>').join("")+'</tr></thead><tbody>';
      for(const r of body){ tb+='<tr>'+r.map(c=>'<td>'+mdInline(c)+'</td>').join("")+'</tr>'; }
      out.push(tb+'</tbody></table>'); continue;
    }
    if(/^>\s?/.test(line)){                                  // 引用
      const buf=[]; while(i<lines.length && /^>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^>\s?/,"")); i++; }
      out.push('<blockquote class="md-quote">'+buf.map(mdInline).join("<br>")+'</blockquote>'); continue;
    }
    if(/^\s*[-*+]\s+/.test(line)){                           // 无序列表
      const buf=[]; while(i<lines.length && /^\s*[-*+]\s+/.test(lines[i])){ buf.push('<li>'+mdInline(lines[i].replace(/^\s*[-*+]\s+/,""))+'</li>'); i++; }
      out.push('<ul class="md-ul">'+buf.join("")+'</ul>'); continue;
    }
    if(/^\s*\d+\.\s+/.test(line)){                           // 有序列表
      const buf=[]; while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ buf.push('<li>'+mdInline(lines[i].replace(/^\s*\d+\.\s+/,""))+'</li>'); i++; }
      out.push('<ol class="md-ol">'+buf.join("")+'</ol>'); continue;
    }
    if(line.trim()===""){ i++; continue; }
    const buf=[line]; i++;                                   // 段落（连续非空非特殊行，软换行→<br>）
    while(i<lines.length && lines[i].trim()!=="" && !isSpecial(lines[i]) &&
          !(lines[i].includes("|") && i+1<lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]))){ buf.push(lines[i]); i++; }
    out.push('<p class="md-p">'+buf.map(mdInline).join("<br>")+'</p>');
  }
  return out.join("");
}

// ── 工具卡片渲染：bash/run_tests 显示终端块；write/edit 显示内容；其余紧凑 JSON ──
function renderToolInvoke(c){
  const name=c.name||"", input=c.input||{};
  if(name==="task" && input.prompt!=null) return `<div class="tchead">🤖 <b>子智能体</b> <span class="tcpath">${esc(input.label||"子任务")}</span></div><div class="tcsub">${esc(String(input.prompt))}</div>`;
  if(name==="bash" && input.cmd!=null) return `<div class="tchead">🔧 <b>bash</b></div><pre class="tterm">$ ${esc(input.cmd)}</pre>`;
  // fs_edit → 红绿 diff（old_string 删除 / new_string 新增）
  if(name==="fs_edit" && input.old_string!=null && input.new_string!=null)
    return `<div class="tchead">✏️ <b>fs_edit</b> <span class="tcpath">${esc(input.path||"")}</span></div>${renderDiff(input.old_string, input.new_string)}`;
  // apply_patch → 直接按补丁行着色（+绿 -红 @@/***头）
  if(name==="apply_patch" && input.patch!=null)
    return `<div class="tchead">🩹 <b>apply_patch</b></div>${renderPatch(input.patch)}`;
  // fs_write → 内容代码块（新建/覆盖）
  if(name==="fs_write" && input.content!=null)
    return `<div class="tchead">🔧 <b>fs_write</b> <span class="tcpath">${esc(input.path||"")}</span></div><pre class="tcode">${esc(String(input.content))}</pre>`;
  return `<div class="tchead">🔧 调用 <b>${esc(name)}</b> <code>${esc(compact(input))}</code></div>`;
}
// U5：红绿 diff 渲染。fs_edit 的 old→new 替换（各行加 -/+ 标记）。
function renderDiff(oldStr, newStr){
  let h='<pre class="tdiff">';
  for(const l of String(oldStr).split("\n")) h+=`<span class="dl del">- ${esc(l)}</span>`;
  for(const l of String(newStr).split("\n")) h+=`<span class="dl add">+ ${esc(l)}</span>`;
  return h+'</pre>';
}
// U5：Codex 风格补丁按行着色。
function renderPatch(txt){
  let h='<pre class="tdiff">';
  for(const raw of String(txt).split("\n")){
    let cls="ctx";
    if(raw.startsWith("+")) cls="add";
    else if(raw.startsWith("-")) cls="del";
    else if(raw.startsWith("@@")||raw.startsWith("***")) cls="hunk";
    h+=`<span class="dl ${cls}">${esc(raw)||" "}</span>`;
  }
  return h+'</pre>';
}
function renderToolResult(ev){
  const o=ev.output||{};
  if(!ev.ok) return `<span class="chip">⛔ 被拦截 <code>${esc(compact(o))}</code></span>`;
  // 子智能体 task：final=子智能体最终回答（渲染为 markdown 小块）
  if(o.final!=null) return `<div class="tchead">🤖 子智能体完成 <span class="tcmeta">${o.steps??"?"} 步</span></div><div class="tcsub md">${renderMarkdown(String(o.final))}</div>`;
  // chart：内联 SVG 图表（base64 img，安全）
  if(o.svg!=null){
    let b64=""; try{ b64=btoa(unescape(encodeURIComponent(o.svg))); }catch(e){}
    const saved=o.saved?` <span class="tcpath">已存 ${esc(String(o.saved).split("/").pop())}</span>`:"";
    return `<div class="tchead">📊 图表${saved}</div><div class="tchartimg"><img alt="chart" src="data:image/svg+xml;base64,${b64}"></div>`;
  }
  // data_describe：数据概览（行数 + 列统计）
  if(o.rows!=null && Array.isArray(o.columns)){
    const cols=o.columns.map(c=>{
      if(c.type==="numeric") return `<tr><td>${esc(c.name)}</td><td>数值</td><td>min ${c.min} · max ${c.max} · 均值 ${c.mean}</td></tr>`;
      const top=(c.top||[]).map(t=>esc(String(t.value))+"("+t.count+")").join("、");
      return `<tr><td>${esc(c.name)}</td><td>文本</td><td>去重 ${c.distinct} · Top ${top}</td></tr>`;
    }).join("");
    return `<div class="tchead">📈 数据概览 <span class="tcmeta">${o.rows} 行 · ${o.columns.length} 列</span></div>`
      +`<table class="tdata"><thead><tr><th>列</th><th>类型</th><th>统计</th></tr></thead><tbody>${cols}</tbody></table>`;
  }
  // U6 办公文档读取
  if(o.kind==="excel" && Array.isArray(o.sheets)){
    const sh=o.sheets[0]||{}; const rows=(sh.data||[]).slice(0,12);
    const body=rows.map((r,i)=>`<tr>${r.slice(0,10).map(c=>i===0?`<th>${esc(String(c))}</th>`:`<td>${esc(String(c))}</td>`).join("")}</tr>`).join("");
    return `<div class="tchead">📊 Excel <span class="tcmeta">${o.sheets.length} sheet · ${sh.name||""} ${sh.rows_total??"?"}×${sh.cols_total??"?"}</span></div><table class="tdata"><tbody>${body}</tbody></table>`;
  }
  if(o.kind==="pptx" && Array.isArray(o.slides)){
    const s=o.slides.map(sl=>`<b>幻灯片 ${sl.slide}</b>\n${sl.text}`).join("\n\n");
    return `<div class="tchead">📑 PPT <span class="tcmeta">${o.slides.length} 页</span></div><pre class="tcode">${esc(s)}</pre>`;
  }
  if((o.kind==="pdf"||o.kind==="docx"||o.kind==="text") && o.text!=null){
    const label={pdf:"📄 PDF",docx:"📝 Word",text:"📄 文本"}[o.kind];
    return `<div class="tchead">${label} <span class="tcmeta">${o.chars??""} 字符</span></div><pre class="tcode">${esc(String(o.text))}</pre>`;
  }
  // LSP 代码智能：诊断/悬停/符号/定位
  if(o.diagnostics!=null) return `<div class="tchead">🔎 LSP 诊断 <span class="tcmeta">${o.diagnostics.length} 条</span></div>`+(o.diagnostics.length?`<pre class="tcode">${esc(o.diagnostics.join("\n"))}</pre>`:`<div class="tcempty">（无诊断）</div>`);
  if(o.hover!=null) return `<div class="tchead">🔎 LSP 悬停</div><pre class="tcode">${esc(String(o.hover))||"（无信息）"}</pre>`;
  if(o.symbols!=null) return `<div class="tchead">🔎 LSP 符号 <span class="tcmeta">${o.symbols.length}</span></div><pre class="tcode">${esc(o.symbols.join("\n"))||"（无）"}</pre>`;
  if(o.locations!=null) return `<div class="tchead">🔎 LSP 定位 <span class="tcmeta">${o.locations.length}</span></div><pre class="tcode">${esc(o.locations.join("\n"))||"（无）"}</pre>`;
  // bash / run_tests 风格：有 stdout/exit_code → 终端块
  const r = o.result || o;   // run_tests 把 shell 结果包在 result 里
  if(r && (r.stdout!=null || r.exit_code!=null || r.timed_out!=null)){
    const out=(r.stdout||"").trimEnd(), err=(r.stderr||"").trimEnd();
    const code=r.exit_code;
    const failed = !!r.timed_out || (code!=null && code!==0);
    const tip = r.timed_out ? "超时" : ("退出码 "+(code ?? "?"));
    const status = `<span class="tcmeta tcstatus ${failed?"bad":"ok"}" title="${tip}">${failed?ICON_X:ICON_CHECK}</span>`;
    let h=`<div class="tchead">${failed?"❌":"✅"} 结果 ${status}</div>`;
    if(out) h+=`<pre class="tterm">${esc(out)}</pre>`;
    if(err) h+=`<pre class="tterm tterr">${esc(err)}</pre>`;
    if(!out && !err) h+=`<div class="tcempty">（无输出）</div>`;
    return h;
  }
  // fs_read / repo_map 等：有 text/tree → 文本块；否则紧凑 JSON
  if(o.text!=null) return `<div class="tchead">✅ 读取 <span class="tcpath">${esc(o.path||"")}</span></div><pre class="tcode">${esc(String(o.text))}</pre>`;
  if(o.tree!=null) return `<div class="tchead">✅ 目录结构</div><pre class="tcode">${esc(String(o.tree))}</pre>`;
  return `<span class="chip">✅ 结果 <code>${esc(compact(o))}</code></span>`;
}
function compact(v){ try{ const s=JSON.stringify(v); return s.length>240?s.slice(0,240)+"…":s; }catch(e){ return String(v); } }

// 打字等待指示器（AI 头像 + 三跳点）。多步回合里每次「AI 在忙但暂无可见输出」都显示。
function showTyping(log){
  if(log._typing) { log.append(log._typing); log.scrollTop=1e9; return; }  // 已存在则移到底部
  const r=el("row typing-row");
  r.append(el("avatar a","AI"), el("bubble typing","<span class='dot'></span><span class='dot'></span><span class='dot'></span>"));
  log.append(r); log._typing=r; log.scrollTop=1e9;
}
function hideTyping(log){ if(log._typing){ log._typing.remove(); log._typing=null; } }

// ── 会话渲染（渲染到指定 log 容器）──
// 打字机：text_delta 累加到 log._raw，每次按 markdown 重渲当前气泡（log._sb）。
function renderEvent(log, ev, sid){
  const k=ev.kind;
  if(k==="text_delta"){
    if(!log._sb){ const r=el("row"); const b=el("bubble md"); r.append(el("avatar a","AI"),b); log.append(r); log._sb=b; log._raw=""; }
    log._raw=(log._raw||"")+(ev.text||"");
    log._sb.innerHTML=renderMarkdown(log._raw);
    log.scrollTop=1e9; return;
  }
  if(k==="user_message"){
    if(log._skipUser){ log._skipUser=false; return; }   // 已乐观渲染，跳过流里的回显
    log._sb=null; const r=el("row user"); r.append(el("avatar u","你"),el("bubble",esc(ev.text))); log.append(r);
  }
  else if(k==="model_message"){
    let bub=null;
    if(log._sb){ log._sb.innerHTML=renderMarkdown(log._raw||ev.text||""); bub=log._sb; log._sb=null; }  // 收尾：定稿 markdown
    else if(ev.text){ const r=el("row"); const b=el("bubble md"); b.innerHTML=renderMarkdown(ev.text); r.append(el("avatar a","AI"),b); log.append(r); bub=b; }
    if(bub) addBubbleActions(bub);   // AI 文本气泡也挂操作按钮（底部行）
  }
  else if(k==="tool_invoked"){ log._sb=null; const t=el("tool"); t.innerHTML=renderToolInvoke(ev.call||{}); addToolActions(t); log.append(t); }
  else if(k==="tool_result"){ const t=el("tool"+(ev.ok?"":" denied")); t.innerHTML=renderToolResult(ev); if(ev.ok) addToolActions(t); log.append(t); }
  else if(k==="approval_requested"){ log._sb=null;
    const t=el("tool approval"); t.dataset.callid=ev.call_id||""; t.dataset.sid=sid||"";
    t.innerHTML=`<div class="tchead">⏸ <b>需要审批</b> <span class="tcpath">${esc(ev.tool||"")}</span></div>`
      +`<div class="apreason">${esc(ev.reason||"该操作需人工确认")}</div>`
      +`<div class="aprow">`
      +`<button class="apbtn reject" data-act="approveTool" data-callid="${esc(ev.call_id||"")}" data-ok="0" data-all="0">✕ 拒绝</button>`
      +`<button class="apbtn allow" data-act="approveTool" data-callid="${esc(ev.call_id||"")}" data-ok="1" data-all="0">✓ 允许</button>`
      +`<button class="apbtn allowall" data-act="approveTool" data-callid="${esc(ev.call_id||"")}" data-ok="1" data-all="1" title="本对话后续需审批的操作不再逐次询问">🔓 本对话全部允许</button>`
      +`</div>`;
    log.append(t); }
  else if(k==="approval_resolved"){
    let matched=false;
    log.querySelectorAll(".tool.approval").forEach(c=>{ if(c.dataset.callid===ev.call_id){ matched=true;
      const row=c.querySelector(".aprow"); if(row) row.remove();
      const prev=c.querySelector(".apresolved"); if(prev) prev.remove();
      const st=el("apresolved "+(ev.approved?"ok":"no"), ev.approved?("✓ 已允许"+(ev.by&&ev.by!=='user'?"（"+esc(ev.by)+"）":"")):"✕ 已拒绝");
      c.appendChild(st);
    }});
    // 「本对话全部允许」后的自动放行：无对应审批卡 → 追加一条低调审计提示，而非弹卡。
    if(!matched && ev.approved && (ev.by||"").indexOf("auto")===0){
      log.append(el("meta apauto","🔓 已自动允许（本对话全部允许）"));
    }
  }
  else if(k==="turn_ended"){ log._sb=null; log.append(el("meta","— 回合 #"+ev.turn+" 结束（"+ev.reason+"，"+ev.steps+" 步）—")); }
  log.scrollTop=1e9;
}

// ── 会话历史：大会话只渲染最近一屏，更早的按需加载（减少解析/渲染/DOM，切换更快）──
const HIST_PAGE = 300;
// 把一段事件渲染进临时容器再整体搬入目标（一次性插入，避免逐条重排）。
function renderInto(target, sid, events){
  const tmp=document.createElement('div'); tmp._sb=null;
  events.forEach(ev=>renderEvent(tmp, ev, sid));
  while(tmp.firstChild) target.append(tmp.firstChild);
}
function makeLoadMore(log, sid, start, total){
  const b=el("loadmore","↑ 加载更早的对话（共 "+total+" 条，已显示最近 "+(total-start)+" 条）");
  b.dataset.sid=sid; b.dataset.before=start;
  b.onclick=()=>loadEarlier(log, b);
  return b;
}
function renderHistory(log, sid, events, start, total){
  const frag=document.createDocumentFragment();
  if(start>0) frag.append(makeLoadMore(log, sid, start, total));   // 上方还有更早的
  renderInto(frag, sid, events);
  log.innerHTML=""; log.append(frag);
}
async function loadEarlier(log, btn){
  const sid=btn.dataset.sid, before=parseInt(btn.dataset.before||"0",10);
  btn.textContent="加载中…";
  const resp=await call({cmd:"get_events",session_id:sid,limit:HIST_PAGE,before});
  const d=(resp&&resp.ok&&resp.data)||{}; const evs=d.events||[];
  const prevH=log.scrollHeight, prevTop=log.scrollTop;   // 锚点：插入更早内容后维持视口
  const frag=document.createDocumentFragment();
  renderInto(frag, sid, evs);
  btn.after(frag);
  if((d.start||0)>0){ btn.dataset.before=d.start; btn.textContent="↑ 加载更早的对话（共 "+d.total+" 条）"; }
  else btn.remove();
  log.scrollTop=prevTop+(log.scrollHeight-prevH);
}

// ── 会话：作为一个 tab 打开（每 tab 独立 log+composer）──
async function openSession(sessionId, autoPrompt){
  const tabId="s:"+sessionId;
  let t=findTab(tabId);
  if(!t){
    t=openTab({id:tabId, kind:"session", title:sessionId, ico:"💬", sessionId});
    const node=document.getElementById("tpl-session").content.cloneNode(true);
    t.view.className="tabview";
    t.view.append(node);
    const inp=t.view.querySelector(".inp2");
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChatTab(t);} });
    inp.addEventListener("input",e=>autoGrow(e.target));
    t.view.querySelector(".tab-send").onclick=()=>sendChatTab(t);
    // 载入历史：只取最近一屏（大会话不再解析/渲染全量）；标题随响应返回，免再查 list_sessions。
    const log=t.view.querySelector(".log"); log.innerHTML="";
    const resp=await call({cmd:"get_events",session_id:sessionId,limit:HIST_PAGE});
    const d=(resp&&resp.ok&&resp.data)||{};
    renderHistory(log, sessionId, d.events||[], d.start||0, d.total||0);
    if(d.title) t.title=d.title||sessionId;
  }
  activateTab(tabId);
  // 打开会话后自动滚到最新消息（底部）：历史是在 tab 隐藏时渲染的，激活后才完成布局，
  // 故延到下一帧再滚（双 rAF 兜底图表/字体导致的二次布局）。
  const _log=t.view.querySelector(".log");
  if(_log) requestAnimationFrame(()=>{ _log.scrollTop=_log.scrollHeight;
    requestAnimationFrame(()=>{ _log.scrollTop=_log.scrollHeight; }); });
  refreshTasks();
  if(autoPrompt){ await doSendTab(t, autoPrompt); }
  else { const inp=t.view.querySelector(".inp2"); if(inp) inp.focus(); }
}

async function doSendTab(t, text){
  const log=t.view.querySelector(".log");
  // 1) 立即乐观渲染用户气泡，并让流里的 user_message 事件跳过一次，避免重复。
  renderEvent(log, {kind:"user_message", text}, t.sessionId);
  log._skipUser = true;
  // 2) 打字等待指示器：立即出现，覆盖「发送→首个 token」的等待。
  showTyping(log);
  await streamSend(t.sessionId, text, (ev)=>{
    if(ev.kind==="stream_done"){ hideTyping(log); return; }
    if(ev.kind==="stream_error"){ hideTyping(log); renderEvent(log,{kind:"model_message",text:"⚠ "+(ev.message||"错误")}, t.sessionId); return; }
    // 有可见输出（文字流/工具卡/模型消息）到达 → 先撤等待动画，再渲染。
    if(ev.kind==="text_delta" || ev.kind==="tool_invoked" || ev.kind==="model_message") hideTyping(log);
    renderEvent(log, ev, t.sessionId);
    // 工具刚出结果 → 模型将继续思考，重新显示等待动画（这是之前缺失的多步等待提示）。
    if(ev.kind==="tool_result") showTyping(log);
    else if(ev.kind==="turn_ended" || ev.kind==="approval_requested") hideTyping(log);
  });
  hideTyping(log);
  const m=(await call({cmd:"list_sessions"})).data.sessions.find(x=>x.id===t.sessionId);
  if(m){ t.title=m.title||t.sessionId; renderTabs(); }
  refreshTasks();
}
async function sendChatTab(t){
  const box=t.view.querySelector(".inp2"); const text=box.value.trim(); if(!text) return;
  box.value=""; autoGrow(box); await doSendTab(t, text);
}

// 状态图标（替代 exit 码文字）：成功 ✓ / 失败 ✕
const ICON_CHECK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
const ICON_X=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
// ── 结果面板操作按钮（复制/分享/点赞/差评）：仅图标 + 原生 tooltip（title），注入到 .tchead 右侧 ──
const TOOL_ACT_BTNS =
  `<button class="tcact" data-act="toolCopy" title="复制" aria-label="复制"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>`+
  `<button class="tcact" data-act="toolShare" title="分享" aria-label="分享"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></button>`+
  `<button class="tcact" data-act="toolLike" title="点赞" aria-label="点赞"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></button>`+
  `<button class="tcact" data-act="toolDislike" title="差评" aria-label="差评"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg></button>`;
function addToolActions(card){
  const head=card.querySelector(".tchead");
  if(!head || head.querySelector(".tcacts")) return;
  const acts=document.createElement("span"); acts.className="tcacts"; acts.innerHTML=TOOL_ACT_BTNS;
  const meta=head.querySelector(".tcmeta");
  if(meta){ meta.after(acts); }                              // 跟在「exit N / N 步」右侧
  else { acts.style.marginLeft="auto"; head.appendChild(acts); }  // 无 meta 时按钮组自己靠右
}
// AI 文本气泡：把同款操作按钮作为底部行追加（气泡无表头，放底部）
function addBubbleActions(bubble){
  if(!bubble || !bubble.innerText.trim() || bubble.querySelector(":scope > .tcacts")) return;
  const acts=document.createElement("div"); acts.className="tcacts bubble-acts"; acts.innerHTML=TOOL_ACT_BTNS;
  bubble.appendChild(acts);
}
// 复制/分享取正文文本（去掉操作按钮本身）；工具卡取正文块，气泡取全文
function panelText(box){
  const clone=box.cloneNode(true); clone.querySelectorAll(".tcacts").forEach(a=>a.remove());
  const parts=[...clone.querySelectorAll(".tterm,.tcode,.tcsub,.tcempty")].map(e=>e.innerText.trim()).filter(Boolean);
  if(parts.length) return parts.join("\n\n");
  const tbl=clone.querySelector(".tdata"); if(tbl) return tbl.innerText.trim();
  return clone.innerText.trim();
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){ try{ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); return true; }catch(_){ return false; } }
}
async function toolCopy(btn){ const ok=await copyText(panelText(btn.closest(".tool,.bubble"))); showToast(ok?"已复制到剪贴板":"复制失败"); }
async function toolShare(btn){
  const txt=panelText(btn.closest(".tool,.bubble"));
  if(navigator.share){ try{ await navigator.share({text:txt}); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
  const ok=await copyText(txt); showToast(ok?"已复制，可粘贴分享":"分享失败");
}
function toolLike(btn){
  const box=btn.closest(".tool,.bubble"); const dis=box.querySelector('[data-act="toolDislike"]');
  const on=btn.classList.toggle("liked"); if(on&&dis) dis.classList.remove("disliked");
  showToast(on?"已点赞 👍":"已取消点赞");
}
function toolDislike(btn){
  const box=btn.closest(".tool,.bubble"); const lk=box.querySelector('[data-act="toolLike"]');
  const on=btn.classList.toggle("disliked"); if(on&&lk) lk.classList.remove("liked");
  showToast(on?"已记录反馈，谢谢":"已取消差评");
}
function showToast(msg){
  let t=document.getElementById("cmx-toast");
  if(!t){ t=document.createElement("div"); t.id="cmx-toast"; t.className="cmx-toast"; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("on");
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove("on"),1600);
}

// 内联 onclick 属性全被拦截。用委托（监听在 document 上，由 nonce'd 脚本注册）在两壳都工作。
const ACTIONS = { newTask, openConnectors, startFromHome, toggleSidebar, toggleTheme, checkUpdate, applyUpdate, toggleMenu, menuSettings, menuAbout, toggleVoice, toggleUserMenu, userProfile, userSwitch, userWorkspace, userLogout,
  toggleTabOverflow, tabCtxClose, tabCtxCloseOthers, tabCtxCloseRight, tabCtxCloseAll };
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(!el){ closeMenu(); closeTabCtx(); document.getElementById("tab-dropdown").classList.remove("on"); return; }
  const act = el.dataset.act;
  if(act === "runConnectorTool"){
    runConnectorTool(el.dataset.tool, el.dataset.online === "1");
  } else if(act === "approveTool"){
    approveTool(el.dataset.callid, el.dataset.ok === "1", el.dataset.all === "1");
  } else if(act === "toolCopy"){ toolCopy(el);
  } else if(act === "toolShare"){ toolShare(el);
  } else if(act === "toolLike"){ toolLike(el);
  } else if(act === "toolDislike"){ toolDislike(el);
  } else if(act === "toggleVoice"){
    toggleVoice(el);
  } else if(act === "showPanel"){
    showPanel(el.dataset.panel);
  } else if(ACTIONS[act]){
    ACTIONS[act]();
  }
});

// 左侧栏宽度可调：拖动 .splitter，宽度存 localStorage，clamp [200,480]
(function initSplitter(){
  const sp=document.getElementById("splitter"), root=document.documentElement;
  try{ const w=localStorage.getItem("cmx-aside-w"); if(w) root.style.setProperty("--aside-w", w+"px"); }catch(e){}
  let startX=0, startW=0, dragging=false;
  const curW=()=>parseInt(getComputedStyle(root).getPropertyValue("--aside-w"))||270;
  sp.addEventListener("pointerdown", e=>{
    dragging=true; startX=e.clientX; startW=curW();
    sp.classList.add("dragging"); sp.setPointerCapture(e.pointerId);
    document.body.style.userSelect="none";
  });
  sp.addEventListener("pointermove", e=>{
    if(!dragging) return;
    const w=Math.max(200,Math.min(480, startW+(e.clientX-startX)));
    root.style.setProperty("--aside-w", w+"px");
  });
  const end=()=>{ if(!dragging) return; dragging=false; sp.classList.remove("dragging"); document.body.style.userSelect="";
    try{ localStorage.setItem("cmx-aside-w", curW()); }catch(e){} };
  sp.addEventListener("pointerup", end); sp.addEventListener("pointercancel", end);
})();
