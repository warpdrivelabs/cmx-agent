# cmx-agent 原生 Tauri 桌面壳。
#
# ⚠️ 本 crate **不是** cmx-agent 离线 workspace 的 member（那会让 tauri 未缓存时 `cargo build --offline`
# 整体失败）。它是独立 crate + 自带 Cargo.lock，经 path 直接复用已测的 cmx-agent-app 核。
# 构建：`cd cmx-agent/crates/cmx-agent-shell/src-tauri && cargo run`（首次联网拉 tauri 依赖并缓存）。
[package]
name = "cmx-agent-shell"
version = "0.2.0"
edition = "2021"
description = "TrueMate · cmx 企业桌面智能体 · 原生 Tauri 壳（同核多壳：复用 cmx-agent-app 的 dispatch_json）"

# 独立解析：本 crate 自成一个单成员 workspace，不向上并入 cmx-agent 离线 workspace。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 复用已建、已测的核（path 直引，不经 .workspace）。壳不含业务逻辑。
cmx-agent-app = { path = "../../cmx-agent-app" }
cmx-agent-core = { path = "../../cmx-agent-core" }
cmx-agent-im = { path = "../../cmx-agent-im" }
cmx-agent-mcp = { path = "../../cmx-agent-mcp" }
cmx-agent-plugin = { path = "../../cmx-agent-plugin" }
tauri = { version = "2", features = [] }
# 自动更新（方案 C1）：updater 插件（check/download/验签/install 全包）+ process 插件（relaunch 备用）。
# 本 crate 是独立 workspace、Cargo.lock 自持——新增依赖首次需联网拉取并更新 Cargo.lock。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"
# K1：endpoint 运行时注入用 `url::Url`（树内已有 2.5.x，锁内即得，离线可解）。
url = "2"
# P1 更新上报：POST /agent-updates/report（reqwest 已在 updater 插件树内，仅声明 json feature 复用）。
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
# 数据根解析在 cmx-agent-app::shared_data_dir（directories 经其传入），本壳不直接引。
# 日志：tracing（核已用）+ subscriber 把 IM 桥/Stream 的 info/warn 打到 stderr（联调抓 chat_id 必需）。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
