# cmx-agent 原生 Tauri 桌面壳。
#
# ⚠️ 本 crate **不是** cmx-agent 离线 workspace 的 member（那会让 tauri 未缓存时 `cargo build --offline`
# 整体失败）。它是独立 crate + 自带 Cargo.lock，经 path 直接复用已测的 cmx-agent-app 核。
# 构建：`cd cmx-agent/crates/cmx-agent-shell/src-tauri && cargo run`（首次联网拉 tauri 依赖并缓存）。
[package]
name = "cmx-agent-shell"
version = "0.1.1"
edition = "2021"
description = "TrueMate · cmx 企业桌面智能体 · 原生 Tauri 壳（同核多壳：复用 cmx-agent-app 的 dispatch_json）"

# 独立解析：本 crate 自成一个单成员 workspace，不向上并入 cmx-agent 离线 workspace。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 复用已建、已测的核（path 直引，不经 .workspace）。壳不含业务逻辑。
cmx-agent-app = { path = "../../cmx-agent-app" }
cmx-agent-core = { path = "../../cmx-agent-core" }
cmx-agent-im = { path = "../../cmx-agent-im" }
cmx-agent-mcp = { path = "../../cmx-agent-mcp" }
cmx-agent-plugin = { path = "../../cmx-agent-plugin" }
tauri = { version = "2", features = [] }
# 自动更新（方案 C1）：updater 插件（check/download/验签/install 全包）+ process 插件（relaunch 备用）。
# 本 crate 是独立 workspace、Cargo.lock 自持——新增依赖首次需联网拉取并更新 Cargo.lock。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"
# K1：endpoint 运行时注入用 `url::Url`（树内已有 2.5.x，锁内即得，离线可解）。
url = "2"
# P1 更新上报：POST /agent-updates/report（reqwest 已在 updater 插件树内，仅声明 json feature 复用）。
# default-features=false + rustls-tls：与主 workspace 各 crate 统一 rustls 后端。
# 此前缺省 default 特性把 default-tls(native-tls/SecurityFramework) 带进依赖统一，
# reqwest 双后端并存时默认走 native-tls → 门户 nginx 拒其 ClientHello（bad protocol
# version），登录/更新上报 Transport 失败而 rustls 探针全通（2026-09-15 排查实录）。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
# 数据根解析在 cmx-agent-app::shared_data_dir（directories 经其传入），本壳不直接引。
# 日志：tracing（核已用）+ subscriber 把 IM 桥/Stream 的 info/warn 打到 stderr（联调抓 chat_id 必需）。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 窗口默认尺寸收敛进真实工作区（三端统一 fit_default_window）：取工作区的依赖仅本平台
# 编译，互相零影响——Windows GetMonitorInfoW rcWork / Linux GDK workarea / macOS
# NSScreen.visibleFrame。gtk 0.18 与 tauri 依赖树同版本（锁内 0.18.2 复用，零新增构建
# 产物；deb depends 已含 libgtk-3-0）；objc2-app-kit 仅 mac 构建时编译。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSScreen"] }
objc2 = "0.6"  # NSScreen::mainScreen 需 MainThreadMarker（objc2 0.6 API，见 work_area_logical）

[features]
custom-protocol = ["tauri/custom-protocol"]
