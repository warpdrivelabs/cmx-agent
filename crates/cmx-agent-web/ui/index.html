      +(items||`<div class="tcempty">（无结果）</div>`);
  }
  // U8 browser_screenshot：截图落工作区（不内联图片，避免 webview 资源协议限制，展示路径+尺寸）
  if(o.bytes!=null && o.width!=null && o.path!=null){
    const kb=(o.bytes/1024).toFixed(0);
    return `<div class="tchead">📷 网页截图 <span class="tcmeta">${o.width}×${o.height} · ${kb} KB</span></div>`
      +`<div class="wf-url">${esc(String(o.path))}</div>`;
  }
  // U8 computer_use：视觉回环轨迹 + 结论
  if(o.computer_use===true){
    const acts=(o.actions||[]).map(a=>`<span class="cuact">${esc(String(a))}</span>`).join("");
    const badge=o.done?`<span class="apresolved ok">✓ 达成</span>`:`<span class="apresolved no">步数用尽</span>`;
    return `<div class="tchead">👁️ computer-use <span class="tcmeta">${o.steps??0} 步</span></div>`
      +(o.goal?`<div class="apreason">🎯 ${esc(String(o.goal))}</div>`:"")
      +(acts?`<div class="cutrace">${acts}</div>`:"")
      +(o.answer?`<div class="tcsub md">${renderMarkdown(String(o.answer))}</div>`:"")
      +`<div style="margin-top:6px">${badge}</div>`;
  }
  // U8 browser_do：交互后结果文本（标题 + URL + 正文；步数）
  if(o.interacted===true && o.text!=null){
    const title=o.title?`<div class="wf-title">${esc(String(o.title))}</div>`:"";
    return `<div class="tchead">⌨️ 浏览器交互 <span class="tcmeta">${o.steps??0} 步 · ${o.chars??""} 字符</span></div>`
      +title+(o.url?`<div class="wf-url">${esc(String(o.url))}</div>`:"")+`<pre class="tcode">${esc(String(o.text))}</pre>`;
  }
  // U8 browser_read：无头渲染后的正文（同 web_fetch 版式，头标「渲染」）
  if(o.rendered===true && o.text!=null){
    const title=o.title?`<div class="wf-title">${esc(String(o.title))}</div>`:"";
    return `<div class="tchead">🖥 渲染网页 <span class="tcmeta">${o.chars??""} 字符</span></div>`
      +title+(o.url?`<div class="wf-url">${esc(String(o.url))}</div>`:"")+`<pre class="tcode">${esc(String(o.text))}</pre>`;
  }
  // U10 web_fetch：网页正文（标题 + URL + 正文文本）
  if(o.text!=null && o.url!=null && o.status!=null){
    const head=`<div class="tchead">🌐 网页 <span class="tcmeta">${o.chars??""} 字符 · HTTP ${o.status}</span></div>`;
    const title=o.title?`<div class="wf-title">${esc(String(o.title))}</div>`:"";
    const link=`<div class="wf-url">${esc(String(o.url))}</div>`;
    return head+title+link+`<pre class="tcode">${esc(String(o.text))}</pre>`;
  }
  // data_describe：数据概览（行数 + 列统计）
  if(o.rows!=null && Array.isArray(o.columns)){
    const cols=o.columns.map(c=>{
      if(c.type==="numeric") return `<tr><td>${esc(c.name)}</td><td>数值</td><td>min ${c.min} · max ${c.max} · 均值 ${c.mean}</td></tr>`;
      const top=(c.top||[]).map(t=>esc(String(t.value))+"("+t.count+")").join("、");
      return `<tr><td>${esc(c.name)}</td><td>文本</td><td>去重 ${c.distinct} · Top ${top}</td></tr>`;
    }).join("");
    return `<div class="tchead">📈 数据概览 <span class="tcmeta">${o.rows} 行 · ${o.columns.length} 列</span></div>`
      +`<table class="tdata"><thead><tr><th>列</th><th>类型</th><th>统计</th></tr></thead><tbody>${cols}</tbody></table>`;
  }
  // U6 办公文档读取
  if(o.kind==="excel" && Array.isArray(o.sheets)){
    const sh=o.sheets[0]||{}; const rows=(sh.data||[]).slice(0,12);
    const body=rows.map((r,i)=>`<tr>${r.slice(0,10).map(c=>i===0?`<th>${esc(String(c))}</th>`:`<td>${esc(String(c))}</td>`).join("")}</tr>`).join("");
    return `<div class="tchead">📊 Excel <span class="tcmeta">${o.sheets.length} sheet · ${sh.name||""} ${sh.rows_total??"?"}×${sh.cols_total??"?"}</span></div><table class="tdata"><tbody>${body}</tbody></table>`;
  }
  if(o.kind==="pptx" && Array.isArray(o.slides)){
    const s=o.slides.map(sl=>`<b>幻灯片 ${sl.slide}</b>\n${sl.text}`).join("\n\n");
    return `<div class="tchead">📑 PPT <span class="tcmeta">${o.slides.length} 页</span></div><pre class="tcode">${esc(s)}</pre>`;
  }
  if((o.kind==="pdf"||o.kind==="docx"||o.kind==="text") && o.text!=null){
    const label={pdf:"📄 PDF",docx:"📝 Word",text:"📄 文本"}[o.kind];
    return `<div class="tchead">${label} <span class="tcmeta">${o.chars??""} 字符</span></div><pre class="tcode">${esc(String(o.text))}</pre>`;
  }
  // LSP 代码智能：诊断/悬停/符号/定位
  if(o.diagnostics!=null) return `<div class="tchead">🔎 LSP 诊断 <span class="tcmeta">${o.diagnostics.length} 条</span></div>`+(o.diagnostics.length?`<pre class="tcode">${esc(o.diagnostics.join("\n"))}</pre>`:`<div class="tcempty">（无诊断）</div>`);
  if(o.hover!=null) return `<div class="tchead">🔎 LSP 悬停</div><pre class="tcode">${esc(String(o.hover))||"（无信息）"}</pre>`;
  if(o.symbols!=null) return `<div class="tchead">🔎 LSP 符号 <span class="tcmeta">${o.symbols.length}</span></div><pre class="tcode">${esc(o.symbols.join("\n"))||"（无）"}</pre>`;
  if(o.locations!=null) return `<div class="tchead">🔎 LSP 定位 <span class="tcmeta">${o.locations.length}</span></div><pre class="tcode">${esc(o.locations.join("\n"))||"（无）"}</pre>`;
  // bash / run_tests 风格：有 stdout/exit_code → 终端块
  const r = o.result || o;   // run_tests 把 shell 结果包在 result 里
  if(r && (r.stdout!=null || r.exit_code!=null || r.timed_out!=null)){
    const out=(r.stdout||"").trimEnd(), err=(r.stderr||"").trimEnd();
    const code=r.exit_code;
    const failed = !!r.timed_out || (code!=null && code!==0);
    const tip = r.timed_out ? "超时" : ("退出码 "+(code ?? "?"));
    const status = `<span class="tcmeta tcstatus ${failed?"bad":"ok"}" title="${tip}">${failed?ICON_X:ICON_CHECK}</span>`;
    let h=`<div class="tchead">${failed?"❌":"✅"} 结果 ${status}</div>`;
    if(out) h+=`<pre class="tterm">${esc(out)}</pre>`;
    if(err) h+=`<pre class="tterm tterr">${esc(err)}</pre>`;
    if(!out && !err) h+=`<div class="tcempty">（无输出）</div>`;
    return h;
  }
  // U15 插件：远程市场（有 url）/ plugin_list 清单（有 dir）/ http/command/wasm 结果 / 安装
  if(o.service==="cmx-plugin" && Array.isArray(o.plugins) && o.url!==undefined){
    const items=o.plugins.map(p=>`<div class="ecrow"><span class="ecl">${esc(String(p.kind||""))}</span><span class="ecc"><span class="cuact">${esc(String(p.name||""))}${p.version?(" <span style=\"color:var(--muted)\">v"+esc(String(p.version))+"</span>"):""}</span><span style="color:var(--muted);font-size:11.5px">${p.installable?"":"（无内嵌清单）"}${esc(String(p.description||""))}</span></span></div>`).join("");
    return `<div class="tchead">🛒 插件市场 ${esc(String(o.market||""))} <span class="tcmeta">${o.count??0} 个可装</span></div>${items||'<div class="tcempty">（市场暂无可装插件）</div>'}<div class="tcempty">plugin_install 传 {name} 即可从市场安装</div>`;
  }
  if(o.service==="cmx-plugin" && Array.isArray(o.plugins)){
    const items=o.plugins.map(p=>`<div class="ecrow"><span class="ecl">${esc(String(p.kind||""))}</span><span class="ecc"><span class="cuact">${esc(String(p.name||""))}</span><span style="color:var(--muted);font-size:11.5px">${esc(String(p.description||""))}</span></span></div>`).join("");
    return `<div class="tchead">🧩 已装插件 <span class="tcmeta">${o.count??0} 个</span></div>${items||'<div class="tcempty">（暂无插件；plugin_install 可装）</div>'}`;
  }
  if(o.service==="cmx-plugin" && o.installed){
    return `<div class="tchead">🧩 插件已安装 <span class="tcmeta">${esc(String(o.name||""))} · ${esc(String(o.kind||""))}</span></div><div class="tcempty">${esc(String(o.note||""))}</div>`;
  }
  if(o.service==="cmx-plugin" && o.plugin){
    const meta=o.kind==="http"?("HTTP "+(o.status||"")):("exit "+(o.exit_code??"?"));
    const body=o.kind==="http"?compact(o.body||{}):(String(o.stdout||"")+(o.stderr?"\n"+o.stderr:""));
    return `<div class="tchead">🧩 ${esc(String(o.plugin))} <span class="tcmeta">${esc(meta)}</span></div><pre class="tcode">${esc(String(body))}</pre>`;
  }
  // U14 业务联动流水线：分步轨迹 + 是否全程完成
  if(o.service==="cmx-chain" && Array.isArray(o.steps)){
    const rows=o.steps.map(s=>`<div class="ecrow"><span class="ecl">${s.ok?"✅":"❌"} 步${s.step} ${esc(String(s.op||""))}</span><span class="ecc"><span class="cuact">${esc(compact(s.ok?(s.output||{}):{error:s.error}))}</span></span></div>`).join("");
    const badge=o.completed?`<span class="apresolved ok">✓ 全程完成</span>`:`<span class="apresolved no">中途失败</span>`;
    return `<div class="tchead">🔗 业务联动 <span class="tcmeta">${o.stepCount??0} 步</span></div>${rows}<div style="margin-top:6px">${badge}</div>`;
  }
  // U12 企业上下文：域模型分组摘要
  if(o.service==="cmx-enterprise" && o.context){
    const c=o.context, sec=(label,g,fmt)=>{ if(!g||!g.items) return "";
      const chips=g.items.map(fmt).map(t=>`<span class="cuact">${esc(t)}</span>`).join("");
      return `<div class="ecrow"><span class="ecl">${label} <b>${g.total}</b></span><span class="ecc">${chips}</span></div>`; };
    return `<div class="tchead">🏛️ 企业域模型</div>`
      +sec("对象",c.objectTypes,x=>(x.displayName||x.apiName||"")+"·"+(x.apiName||""))
      +sec("关系",c.relations,x=>(x.apiName||"")+"("+(x.from||"?")+"→"+(x.to||"?")+")")
      +sec("动作",c.actions,x=>(x.displayName||x.apiName||""))
      +sec("流程",c.flows,x=>(x.name||x.key||"")+(x.startable?"✓":""))
      +sec("报表",c.reports,x=>(x.name||x.code||""));
  }
  // U11 引擎写侧：flow 起实例 / 办任务 · onto 建对象 / 执行动作 · report 计算
  if(o.service==="cmx-flow" && (o.started||o.completed)){
    const act=o.started?"⚙️ 已发起流程实例":"⚙️ 已办理任务";
    const id=o.instanceId||o.taskId||"";
    return `<div class="tchead">${act} <span class="tcmeta">cmx-flow</span></div>`
      +(id?`<div class="wf-url">${esc(String(id))}${o.status?" · "+esc(String(o.status)):""}</div>`:"");
  }
  if(o.service==="cmx-ontology" && (o.wrote||o.executed)){
    const act=o.wrote?("🧩 已写对象 "+esc(String(o.objectType||""))):("🧩 已执行动作 "+esc(String(o.actionType||""))+(o.dryRun?"（试算）":""));
    return `<div class="tchead">${act} <span class="tcmeta">cmx-ontology</span></div>`
      +`<pre class="tcode">${esc(compact(o.data||{}))}</pre>`;
  }
  if(o.service==="cmx-report" && o.computed){
    return `<div class="tchead">📊 已计算报表 ${esc(String(o.reportCode||""))} <span class="tcmeta">${o.cellCount??"?"} 格 · 错误 ${o.errorCount??0}</span></div>`;
  }
  // fs_read / repo_map 等：有 text/tree → 文本块；否则紧凑 JSON
  if(o.text!=null) return `<div class="tchead">✅ 读取 <span class="tcpath">${esc(o.path||"")}</span></div><pre class="tcode">${esc(String(o.text))}</pre>`;
  if(o.tree!=null) return `<div class="tchead">✅ 目录结构</div><pre class="tcode">${esc(String(o.tree))}</pre>`;
  return `<span class="chip">✅ 结果 <code>${esc(compact(o))}</code></span>`;
}
function compact(v){ try{ const s=JSON.stringify(v); return s.length>240?s.slice(0,240)+"…":s; }catch(e){ return String(v); } }

// 打字等待指示器（AI 头像 + 三跳点）。多步回合里每次「AI 在忙但暂无可见输出」都显示。
function showTyping(log){
  if(log._typing) { log.append(log._typing); log.scrollTop=1e9; return; }  // 已存在则移到底部
  const r=el("row typing-row");
  r.append(el("avatar a","AI"), el("bubble typing","<span class='dot'></span><span class='dot'></span><span class='dot'></span>"));
  log.append(r); log._typing=r; log.scrollTop=1e9;
}
function hideTyping(log){ if(log._typing){ log._typing.remove(); log._typing=null; } }

// ── 会话渲染（渲染到指定 log 容器）──
// 打字机：text_delta 累加到 log._raw，每次按 markdown 重渲当前气泡（log._sb）。
function renderEvent(log, ev, sid){
  const k=ev.kind;
  if(k==="text_delta"){
    if(!log._sb){ const r=el("row"); const b=el("bubble md"); r.append(el("avatar a","AI"),b); log.append(r); log._sb=b; log._raw=""; }
    log._raw=(log._raw||"")+(ev.text||"");
    log._sb.innerHTML=renderMarkdown(log._raw);
    log.scrollTop=1e9; return;
  }
  if(k==="user_message"){
    if(log._skipUser){ log._skipUser=false; return; }   // 已乐观渲染，跳过流里的回显
    log._sb=null; const r=el("row user"); r.append(el("avatar u","你"),el("bubble",esc(ev.text))); log.append(r);
  }
  else if(k==="model_message"){
    let bub=null;
    if(log._sb){ log._sb.innerHTML=renderMarkdown(log._raw||ev.text||""); bub=log._sb; log._sb=null; }  // 收尾：定稿 markdown
    else if(ev.text){ const r=el("row"); const b=el("bubble md"); b.innerHTML=renderMarkdown(ev.text); r.append(el("avatar a","AI"),b); log.append(r); bub=b; }
    if(bub) addBubbleActions(bub);   // AI 文本气泡也挂操作按钮（底部行）
  }
  else if(k==="tool_invoked"){ log._sb=null; const t=el("tool"); t.innerHTML=renderToolInvoke(ev.call||{}); addToolActions(t); log.append(t); }
  else if(k==="tool_result"){ const t=el("tool"+(ev.ok?"":" denied")); t.innerHTML=renderToolResult(ev); if(ev.ok) addToolActions(t); log.append(t); }
  else if(k==="approval_requested"){ log._sb=null;
    const t=el("tool approval"); t.dataset.callid=ev.call_id||""; t.dataset.sid=sid||"";
    t.innerHTML=`<div class="tchead">⏸ <b>需要审批</b> <span class="tcpath">${esc(ev.tool||"")}</span></div>`
      +`<div class="apreason">${esc(ev.reason||"该操作需人工确认")}</div>`
      +`<div class="aprow">`
      +`<button class="apbtn reject" data-act="approveTool" data-callid="${esc(ev.call_id||"")}" data-ok="0" data-all="0">✕ 拒绝</button>`
      +`<button class="apbtn allow" data-act="approveTool" data-callid="${esc(ev.call_id||"")}" data-ok="1" data-all="0">✓ 允许</button>`
      +`<button class="apbtn allowall" data-act="approveTool" data-callid="${esc(ev.call_id||"")}" data-ok="1" data-all="1" title="本对话后续需审批的操作不再逐次询问">🔓 本对话全部允许</button>`
      +`</div>`;
    log.append(t); }
  else if(k==="approval_resolved"){
    let matched=false;
    log.querySelectorAll(".tool.approval").forEach(c=>{ if(c.dataset.callid===ev.call_id){ matched=true;
      const row=c.querySelector(".aprow"); if(row) row.remove();
      const prev=c.querySelector(".apresolved"); if(prev) prev.remove();
      const st=el("apresolved "+(ev.approved?"ok":"no"), ev.approved?("✓ 已允许"+(ev.by&&ev.by!=='user'?"（"+esc(ev.by)+"）":"")):"✕ 已拒绝");
      c.appendChild(st);
    }});
    // 「本对话全部允许」后的自动放行：无对应审批卡 → 追加一条低调审计提示，而非弹卡。
    if(!matched && ev.approved && (ev.by||"").indexOf("auto")===0){
      log.append(el("meta apauto","🔓 已自动允许（本对话全部允许）"));
    }
  }
  else if(k==="turn_ended"){ log._sb=null; log.append(el("meta","— 回合 #"+ev.turn+" 结束（"+ev.reason+"，"+ev.steps+" 步）—")); }
  // Note：内核注记，回合出错时把错误文案作为 Note 追加（与飞书回发同一份内容，保证两端一致）。
  else if(k==="note"){ log._sb=null; log.append(el("meta note",esc(ev.text||""))); }
  log.scrollTop=1e9;
}

// ── 会话事件总线实时通道（U16）──
// 后端常驻 task 把 AgentApp 的 SessionEventBus 广播成全局 `session_event` Tauri 事件；前端监听后
// 按 session_id 分流：已打开的 tab 实时 renderEvent，并节流刷新会话列表（让新 IM 会话出现/排序）。
// 本地发起的回合在 STREAMING 集合里 → 跳过（交给 streamSend 的流式通道，避免双重渲染）；
// IM（飞书/微信/钉钉…）来源会话永不在 STREAMING → 实时渲染，实现「飞书发消息实时显示到对话界面」。
let _refreshTasksTimer = null;
function scheduleRefreshTasks(){
  if(_refreshTasksTimer) return;          // 已排队：合并到下一次
  _refreshTasksTimer = setTimeout(()=>{ _refreshTasksTimer=null; refreshTasks(); }, 400);
}
function onSessionEvent(env){
  if(!env || !env.session_id || !env.event) return;
  const sid = env.session_id, ev = env.event;
  if(STREAMING.has(sid)) return;          // 本地流式中：交给 streamSend，避免重复
  let tab = findTab("s:"+sid);
  if(!tab){
    // 远程（IM）来源新会话：同步建 tab+log，让本条及后续实时事件立即渲染（不被 get_events 擦除）；
    // 后台 get_events 补历史时只 prepend 未渲染过的事件，不擦除。避免「首条消息被 openSession 擦掉」。
    openSessionLive(sid);
    tab = findTab("s:"+sid);
  }
  const log = tab && tab.view.querySelector(".log");
  if(log){
    // 去重：已渲染过的 seq 跳过（防历史 prepend 与实时事件重复）。
    if(ev.seq && (log._seqs=log._seqs||new Set()).has(ev.seq)) { /* 已渲染 */ }
    else {
      // session_event 通道（IM 来源）渲染 user_message 时无视 _skipUser——那是本地乐观渲染
      // （doSendTab）专用标志，跨回合/跨通道残留会误吞 IM 的首条用户消息。
      const saved = log._skipUser; log._skipUser = false;
      renderEvent(log, ev, sid);
      log._skipUser = saved;
      if(ev.seq) log._seqs.add(ev.seq);
    }
  }
  scheduleRefreshTasks();
}

// 远程来源会话首次有事件时同步建 tab：实时事件立即渲染进 log；后台 get_events 补历史（prepend，不擦除）。
// 这是「飞书首条消息实时显示」的关键——若用普通 openSession（get_events 返回后 log.innerHTML="" 重画），
// 会与并发到达的实时事件竞态，把首条 user_message 擦掉。
function openSessionLive(sessionId){
  const tabId="s:"+sessionId;
  if(findTab(tabId)) return;
  const t=openTab({id:tabId, kind:"session", title:sessionId, ico:"💬", sessionId});
  const node=document.getElementById("tpl-session").content.cloneNode(true);
  t.view.className="tabview";
  t.view.append(node);
  const inp=t.view.querySelector(".inp2");
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChatTab(t);} });
  inp.addEventListener("input",e=>autoGrow(e.target));
  t.view.querySelector(".tab-send").onclick=()=>sendChatTab(t);
  const log=t.view.querySelector(".log"); log.innerHTML=""; log._seqs=new Set(); log._sb=null;
  activateTab(tabId);
  refreshTasks();
  // 后台补历史：把未渲染过的事件 prepend 到 log 顶部（历史在上、实时新事件在下），不擦除。
  call({cmd:"get_events",session_id:sessionId,limit:HIST_PAGE}).then(resp=>{
    const d=(resp&&resp.ok&&resp.data)||{}; const evs=d.events||[];
    const frag=document.createDocumentFragment();
    if((d.start||0)>0) frag.append(makeLoadMore(log, sessionId, d.start, d.total||0));
    evs.forEach(ev=>{
      if(log._seqs.has(ev.seq)) return;
      const tmp=document.createElement('div'); tmp._sb=null;
      const s=tmp._skipUser; tmp._skipUser=false; renderEvent(tmp, ev, sessionId); tmp._skipUser=s;
      while(tmp.firstChild) frag.append(tmp.firstChild);
      log._seqs.add(ev.seq);
    });
    log.prepend(frag);
    if(d.title){ t.title=d.title||sessionId; renderTabs(); }

// ── 会话历史：大会话只渲染最近一屏，更早的按需加载（减少解析/渲染/DOM，切换更快）──
const HIST_PAGE = 300;
// 把一段事件渲染进临时容器再整体搬入目标（一次性插入，避免逐条重排）。
function renderInto(target, sid, events){
  const tmp=document.createElement('div'); tmp._sb=null;
  // 历史回放无视 _skipUser（那是本地乐观渲染专用标志，残留会误吞历史首条用户消息）。
  events.forEach(ev=>{ const s=tmp._skipUser; tmp._skipUser=false; renderEvent(tmp, ev, sid); tmp._skipUser=s; (target._seqs=target._seqs||new Set()).add(ev.seq); });
  while(tmp.firstChild) target.append(tmp.firstChild);
}
function makeLoadMore(log, sid, start, total){
  const b=el("loadmore","↑ 加载更早的对话（共 "+total+" 条，已显示最近 "+(total-start)+" 条）");
  b.dataset.sid=sid; b.dataset.before=start;
  b.onclick=()=>loadEarlier(log, b);
  return b;
}function renderHistory(log, sid, events, start, total){
  const frag=document.createDocumentFragment();
  if(start>0) frag.append(makeLoadMore(log, sid, start, total));   // 上方还有更早的
  renderInto(frag, sid, events);
  log.innerHTML=""; log.append(frag);
}
async function loadEarlier(log, btn){
  const sid=btn.dataset.sid, before=parseInt(btn.dataset.before||"0",10);
  btn.textContent="加载中…";
  const resp=await call({cmd:"get_events",session_id:sid,limit:HIST_PAGE,before});
  const d=(resp&&resp.ok&&resp.data)||{}; const evs=d.events||[];
  const prevH=log.scrollHeight, prevTop=log.scrollTop;   // 锚点：插入更早内容后维持视口
  const frag=document.createDocumentFragment();
  renderInto(frag, sid, evs);
  btn.after(frag);
  if((d.start||0)>0){ btn.dataset.before=d.start; btn.textContent="↑ 加载更早的对话（共 "+d.total+" 条）"; }
  else btn.remove();
  log.scrollTop=prevTop+(log.scrollHeight-prevH);
}

// ── 会话：作为一个 tab 打开（每 tab 独立 log+composer）──
async function openSession(sessionId, autoPrompt){
  const tabId="s:"+sessionId;
  let t=findTab(tabId);
  if(!t){
    t=openTab({id:tabId, kind:"session", title:sessionId, ico:"💬", sessionId});
    const node=document.getElementById("tpl-session").content.cloneNode(true);
    t.view.className="tabview";
    t.view.append(node);
    const inp=t.view.querySelector(".inp2");
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChatTab(t);} });
    inp.addEventListener("input",e=>autoGrow(e.target));
    t.view.querySelector(".tab-send").onclick=()=>sendChatTab(t);
    // 载入历史：只取最近一屏（大会话不再解析/渲染全量）；标题随响应返回，免再查 list_sessions。
    const log=t.view.querySelector(".log"); log.innerHTML="";
    const resp=await call({cmd:"get_events",session_id:sessionId,limit:HIST_PAGE});
    const d=(resp&&resp.ok&&resp.data)||{};
    renderHistory(log, sessionId, d.events||[], d.start||0, d.total||0);
    if(d.title) t.title=d.title||sessionId;
  }
  activateTab(tabId);
  // 打开会话后自动滚到最新消息（底部）：历史是在 tab 隐藏时渲染的，激活后才完成布局，
  // 故延到下一帧再滚（双 rAF 兜底图表/字体导致的二次布局）。
  const _log=t.view.querySelector(".log");
  if(_log) requestAnimationFrame(()=>{ _log.scrollTop=_log.scrollHeight;
    requestAnimationFrame(()=>{ _log.scrollTop=_log.scrollHeight; }); });
  refreshTasks();
  if(autoPrompt){ await doSendTab(t, autoPrompt); }
  else { const inp=t.view.querySelector(".inp2"); if(inp) inp.focus(); }
}

async function doSendTab(t, text){
  const log=t.view.querySelector(".log");
  // 1) 立即乐观渲染用户气泡，并让流里的 user_message 事件跳过一次，避免重复。
  renderEvent(log, {kind:"user_message", text}, t.sessionId);
  log._skipUser = true;
  // 2) 打字等待指示器：立即出现，覆盖「发送→首个 token」的等待。
  showTyping(log);
  await streamSend(t.sessionId, text, (ev)=>{
    if(ev.kind==="stream_done"){ hideTyping(log); return; }
    if(ev.kind==="stream_error"){ hideTyping(log); renderEvent(log,{kind:"model_message",text:"⚠ "+(ev.message||"错误")}, t.sessionId); return; }
    // 有可见输出（文字流/工具卡/模型消息）到达 → 先撤等待动画，再渲染。
    if(ev.kind==="text_delta" || ev.kind==="tool_invoked" || ev.kind==="model_message") hideTyping(log);
    renderEvent(log, ev, t.sessionId);
    // 工具刚出结果 → 模型将继续思考，重新显示等待动画（这是之前缺失的多步等待提示）。
    if(ev.kind==="tool_result") showTyping(log);
    else if(ev.kind==="turn_ended" || ev.kind==="approval_requested") hideTyping(log);
  });
  hideTyping(log);
  const m=(await call({cmd:"list_sessions"})).data.sessions.find(x=>x.id===t.sessionId);
  if(m){ t.title=m.title||t.sessionId; renderTabs(); }
  refreshTasks();
}
async function sendChatTab(t){
  const box=t.view.querySelector(".inp2"); const text=box.value.trim(); if(!text) return;
  box.value=""; autoGrow(box); await doSendTab(t, text);
}

// 语音输入（Web Speech API：Chrome / WKWebView 支持；把语音转文本填入当前输入框）
function toggleVoice(btn){
  if(!btn) return;
  if(window._rec){ try{ window._rec.stop(); }catch(e){} window._rec=null; btn.classList.remove("recording"); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ showToast("此环境不支持语音识别（需 Web Speech API）"); return; }
  const input = document.querySelector(".tabview.active .inp2") || document.getElementById("inp");
  if(!input){ return; }
  const base = input.value;
  const rec = new SR(); window._rec=rec;
  rec.lang="zh-CN"; rec.interimResults=true; rec.continuous=false;
  rec.onresult=(e)=>{ let t=""; for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript;
    input.value=(base?base+" ":"")+t; input.dispatchEvent(new Event("input")); };
  rec.onerror=(e)=>{ btn.classList.remove("recording"); window._rec=null; showToast("语音识别出错："+((e&&e.error)||"")); };
  rec.onend=()=>{ btn.classList.remove("recording"); window._rec=null; };
  try{ rec.start(); btn.classList.add("recording"); showToast("🎙 正在聆听…（再点停止）"); }
  catch(err){ btn.classList.remove("recording"); window._rec=null; showToast("无法启动麦克风"); }
}

// ── IM 绑定（飞书 ↔ 门户账号）──
// 验证码模式：点「获取验证码」→ 把码发到飞书机器人 → 机器人侧核销并建立绑定。
// 之后飞书消息按绑定用户身份跑 agent（数据权限按此人）。
async function imBinding(){
  closeMenu();
  if(!CURRENT_USER){ showToast("请先登录"); return; }
  // 弹层（点遮罩关闭）
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center";
  const box=document.createElement("div");
  box.style.cssText="width:400px;max-width:90vw;background:var(--panel,#1e1e2e);border:1px solid var(--border,#333);border-radius:12px;padding:18px 20px;color:var(--fg,#ddd);font-size:13px";
  box.innerHTML=`
    <div style="font-weight:700;font-size:15px;margin-bottom:10px">🔗 IM 绑定</div>
    <div style="color:var(--muted,#999);margin-bottom:12px;line-height:1.6">
      把你的飞书账号绑定到当前登录账号。绑定后，你在飞书给机器人发消息，
      智能体将<b>以你的身份</b>运行（数据权限按你的账号判定）。
    </div>
    <div id="imb-code-row" style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
      <button id="imb-gen" style="flex:none;padding:6px 12px;border-radius:8px;border:1px solid var(--border,#444);background:var(--accent,#4f46e5);color:#fff;cursor:pointer">获取验证码</button>
      <span id="imb-code" style="font-family:monospace;font-size:20px;letter-spacing:3px;font-weight:700"></span>
    </div>
    <div id="imb-hint" style="color:var(--muted,#999);margin-bottom:12px;line-height:1.5"></div>
    <div style="font-weight:600;margin-bottom:6px">已绑定账号</div>
    <div id="imb-list" style="min-height:36px;margin-bottom:10px"></div>
    <div style="text-align:right"><button id="imb-close" style="padding:5px 14px;border-radius:8px;border:1px solid var(--border,#444);background:transparent;color:inherit;cursor:pointer">关闭</button></div>`;
  ov.append(box);
  ov.onclick=(e)=>{ if(e.target===ov) ov.remove(); };
  box.querySelector("#imb-close").onclick=()=>ov.remove();
  document.body.append(ov);

  const codeEl=box.querySelector("#imb-code"), hintEl=box.querySelector("#imb-hint"), listEl=box.querySelector("#imb-list");
  const refreshList=async()=>{
    listEl.textContent="加载中…";
    const r=await call({cmd:"im_list_bindings"});
    const items=(r.ok&&r.data&&r.data.items)||[];
    if(!r.ok){ listEl.textContent="查询失败："+((r.error&&r.error.message)||"未知"); return; }
    if(!items.length){ listEl.innerHTML='<span style="color:var(--muted,#999)">（暂无绑定）</span>'; return; }
    listEl.innerHTML="";
    items.forEach(b=>{
      const row=document.createElement("div");
      row.style.cssText="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border,#333)";
      row.innerHTML=`<span>${esc(b.provider)} · <span style="font-family:monospace">${esc(String(b.open_id).slice(0,14))}…</span></span>`;
      const del=document.createElement("button");
      del.textContent="解绑"; del.style.cssText="padding:3px 10px;border-radius:6px;border:1px solid var(--border,#444);background:transparent;color:#f66;cursor:pointer";
      del.onclick=async()=>{
        const r2=await call({cmd:"im_unbind",provider:b.provider,open_id:b.open_id});
        if(r2.ok){ showToast("已解绑"); refreshList(); } else { showToast("解绑失败："+((r2.error&&r2.error.message)||"未知")); }
      };
      row.append(del); listEl.append(row);
    });
  };
  box.querySelector("#imb-gen").onclick=async(e)=>{
    e.target.disabled=true; e.target.textContent="生成中…";
    const r=await call({cmd:"im_bind_gen_code"});
    e.target.disabled=false; e.target.textContent="重新获取";
    if(!r.ok){ hintEl.textContent="❌ "+((r.error&&r.error.message)||"生成失败"); return; }
    const d=r.data||{};
    codeEl.textContent=d.code||"";
    hintEl.innerHTML="在<b>飞书</b>里给机器人发送这个验证码完成绑定（"+((d.expires_in||300)/60)+" 分钟内有效）。";
    setTimeout(refreshList, 3000); // 用户发码后稍等刷新列表
  };
  refreshList();
}

// kind → 图标兜底 / 底色 / 中文名
const KIND_ICON={http:"🌐",command:"⌘",wasm:"🧱",mcp:"🔌",connector:"🧩"};
const KIND_COLOR={http:"#2a78d6",command:"#4a3aa7",wasm:"#1baf7a",mcp:"#eda100",connector:"#eb6834"};
const KIND_LABEL={http:"HTTP 端点",command:"Shell 命令",wasm:"WebAssembly",mcp:"MCP 服务",connector:"连接器"};
function plugIcon(p){ return p.icon || KIND_ICON[p.kind] || "🧩"; }
function plugColor(p){ return KIND_COLOR[p.kind] || "#6b7280"; }
function plugMeta(p,installed){
  const state = installed ? (p.enabled===false ? "已禁用" : "已启用") : null;
  const parts=[p.author||"cmx", p.version?("v"+p.version):null, KIND_LABEL[p.kind]||p.kind, state].filter(Boolean);
  return parts.join(" · ");
}

// 插件状态缓存（列表在侧栏 master，详情在主区 tab，两处 DOM 树不同 → 用模块级状态共享）
let PLUGIN_STATE={installed:[], market:[]};

// 侧栏插件列表（master，保持在原侧栏位置）：点活动栏 🧩 由 showPanel 触发。
async function loadPluginSidebar(){
  const list=document.getElementById("pg-list");
  if(!list) return;
  // 首次绑定搜索/刷新
  const search=document.getElementById("pg-search-input");
  if(search && !search.dataset.bound){ search.dataset.bound="1"; search.oninput=()=>filterPluginSidebar(search.value); }
  const rf=document.getElementById("pg-refresh");
  if(rf && !rf.dataset.bound){ rf.dataset.bound="1"; rf.onclick=()=>loadPluginSidebar(); }
  list.innerHTML='<div class="pg-loading">正在加载插件…</div>';
  const resp=await call({cmd:"list_plugins"});
  const data=(resp&&resp.ok&&resp.data)||{};
  const installed=data.installed||[];
  let market=data.market||[];
  if(!market.length) market=PLUG_MARKET_DEMO;   // 后端未配市场 URL → 演示目录兜底
  PLUGIN_STATE={installed, market};
  renderPluginSidebar(installed, market);
}

function renderPluginSidebar(installed, market){
  const list=document.getElementById("pg-list");
  list.innerHTML="";
  const sec=(t)=>{ const s=el("pg-sec"); s.textContent=t; list.append(s); };
  const row=(p, isInstalled)=>{
    const off = isInstalled && p.enabled===false;
    const it=el("plug-item pg-item"+(off?" pg-off":""));
    it.dataset.act="pluginSelect"; it.dataset.pkey=p.name; it.dataset.pinstalled=isInstalled?"1":"0";
    it.innerHTML=`<div class="pic" style="background:${plugColor(p)}">${esc(plugIcon(p))}</div>
      <div class="pm"><div class="pn">${esc(p.name||"")}</div><div class="pd">${esc(p.description||"")}</div><div class="pmeta">${esc(plugMeta(p,isInstalled))}</div></div>
      <div class="pbtn ${isInstalled?'installed':''}">${isInstalled?(off?'已禁用':'已安装'):'安装'}</div>`;
    list.append(it);
  };
  sec("已安装 ("+installed.length+")");
  if(installed.length) installed.forEach(p=>row(p,true));
  else { const e=el("pg-hint"); e.textContent="（暂无已安装插件；从市场安装后重启生效）"; list.append(e); }
  sec("市场 ("+market.length+")");
  market.forEach(p=>row(p,false));
}

function filterPluginSidebar(q){
  q=(q||"").trim().toLowerCase();
  document.querySelectorAll("#pg-list .pg-item").forEach(it=>{
    const hit=!q || it.textContent.toLowerCase().includes(q);
    it.style.display=hit?"":"none";
  });
}

// VSCode 式详情：头部 + 能力/权限 + 信息页（HTML 链接 iframe 内嵌 + 外开兜底）。已装/未装差异化。
function renderPluginDetail(view, p, installed){
  const d=view.querySelector(".pg-detail");
  const enabled = p.enabled!==false;   // 已装默认启用；后端 enabled:false 表示禁用
  const badge=installed
    ? (enabled ? `<span class="pg-badge installed">✓ 已安装 · 已启用</span>`
               : `<span class="pg-badge disabled">⊘ 已安装 · 已禁用</span>`)
    : `<span class="pg-badge market">☁ 未安装</span>`;
  const actions=installed
    ? `<button class="pg-actbtn" data-act="pluginUninstall" data-pkey="${esc(p.name)}">卸载</button>
       <button class="pg-actbtn ghost" data-act="pluginToggle" data-pkey="${esc(p.name)}" data-enabled="${enabled?'1':'0'}">${enabled?'禁用':'启用'}</button>`
    : `<button class="pg-actbtn primary" data-act="pluginInstall" data-pkey="${esc(p.name)}">安装</button>`;
  const openBtn=p.homepage?`<button class="pg-actbtn ghost" data-act="pluginOpenHomepage" data-url="${esc(p.homepage)}">⧉ 在浏览器打开</button>`:"";
  // 能力/权限 chips + 载体特有
  const chips=[];
  chips.push(`<span class="pg-chip">${esc(KIND_LABEL[p.kind]||p.kind||"插件")}</span>`);
  (p.permissions||[]).forEach(pm=>chips.push(`<span class="pg-chip perm">🔒 ${esc(pm)}</span>`));
  if(p.requiresApproval) chips.push(`<span class="pg-chip warn">需审批</span>`);
  const carrier=[];
  const kv=(k,v)=>{ if(v!=null&&v!=="") carrier.push(`<div class="pg-kv"><span class="k">${esc(k)}</span><span class="v">${esc(String(v))}</span></div>`); };
  if(p.kind==="http"){ kv("base_url",p.baseUrl); kv("method",p.method); kv("path",p.path); }
  else if(p.kind==="command"){ kv("command",p.command); if((p.args||[]).length) kv("args",(p.args||[]).join(" ")); }
  else if(p.kind==="wasm"){ kv("module",p.module); kv("invoke",p.invoke); kv("runtime",p.runtime); }
  else if(p.kind==="mcp"){ kv("command",p.command); if((p.args||[]).length) kv("args",(p.args||[]).join(" ")); }
  // 信息页
  let info;
  if(p.homepage){
    info=`<div class="pg-frame-bar">信息页：<a class="pg-link" data-act="pluginOpenHomepage" data-url="${esc(p.homepage)}">${esc(p.homepage)}</a><span class="pg-frame-hint">（若下方空白说明该页禁止内嵌，请点链接在浏览器打开）</span></div>
      <iframe class="pg-frame" src="${esc(p.homepage)}" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>`;
  } else {
    info=`<div class="pg-empty sm">该插件未提供信息页（cmx-plugin.json 的 homepage 字段）。</div>`;
  }
  d.innerHTML=`<div class="pg-detail-inner ${installed?'is-installed':'is-market'}">
    <div class="pg-topbar"></div>
    <div class="pg-head">
      <div class="pg-ico" style="background:${plugColor(p)}">${esc(plugIcon(p))}</div>
      <div class="pg-h-main">
        <div class="pg-title">${esc(p.name||"")} ${badge}</div>
        <div class="pg-sub">${esc(plugMeta(p,installed))}</div>
        <div class="pg-desc">${esc(p.description||"")}</div>
        <div class="pg-actions">${actions}${openBtn}</div>
      </div>
    </div>
    <div class="pg-sec-h">能力与权限</div>
    <div class="pg-chips">${chips.join("")}</div>
    ${carrier.length?`<div class="pg-kvs">${carrier.join("")}</div>`:""}
    <div class="pg-sec-h">信息</div>
    ${info}
  </div>`;
}

// —— 插件 master-detail 交互（列表在侧栏，详情在主区 tab）——
function pluginSelect(el){
  const key=el.dataset.pkey, installed=el.dataset.pinstalled==="1";

  const p=(pool||[]).find(x=>x.name===key); if(!p) return;
  document.querySelectorAll("#pg-list .pg-item.sel").forEach(x=>x.classList.remove("sel"));
  el.classList.add("sel");
  openPluginDetail(p, installed);
}
function pluginOpenHomepage(el){
  const url=el.dataset.url; if(!url) return;
  try{ window.open(url, "_blank", "noopener"); }catch(e){ showToast("无法打开链接"); }
}
// 安装：从当前选中的市场插件取内嵌 manifest → 前门 install_plugin（点击即人工授权）→ 刷新。
async function pluginInstall(el){
  const key=el.dataset.pkey;
  const p=(PLUGIN_STATE.market||[]).find(x=>x.name===key);
  if(!p){ showToast("未找到该市场插件"); return; }
  if(!p.manifest){ showToast("该市场条目未内嵌清单，无法安装"); return; }
  el.disabled=true; el.textContent="安装中…";
  const r=await call({cmd:"install_plugin", manifest:p.manifest});
  if(r&&r.ok){
    const note=(r.data&&r.data.note)||"已安装";
    showToast("已安装「"+key+"」· "+note);
    await loadPluginSidebar();
    const np=(PLUGIN_STATE.installed||[]).find(x=>x.name===key);
    reopenPluginDetail(np||p, !!np);   // 详情切到「已安装」态
  } else {
    el.disabled=false; el.textContent="安装";
    showToast("安装失败："+((r&&r.error&&r.error.message)||"未知错误"));
  }
}
// 卸载：两段式确认（首点变红「确认卸载」，3s 内再点才执行；两壳都稳，不依赖 window.confirm）。
async function pluginUninstall(el){
  const key=el.dataset.pkey;
  if(el.dataset.armed!=="1"){
    el.dataset.armed="1"; el.classList.add("danger"); const old=el.textContent; el.textContent="确认卸载？";
    el._t=setTimeout(()=>{ el.dataset.armed="0"; el.classList.remove("danger"); el.textContent=old; }, 3000);
    return;
  }
  clearTimeout(el._t); el.dataset.armed="0"; el.disabled=true; el.textContent="卸载中…";
  const r=await call({cmd:"uninstall_plugin", name:key});
  if(r&&r.ok){
    const note=(r.data&&r.data.note)||"已卸载";
    showToast("已卸载「"+key+"」· "+note);
    await loadPluginSidebar();
    const mp=(PLUGIN_STATE.market||[]).find(x=>x.name===key);
    if(mp) reopenPluginDetail(mp, false); else resetPluginDetail();
  } else {
    el.disabled=false; el.textContent="卸载";
    showToast("卸载失败："+((r&&r.error&&r.error.message)||"未知错误"));
  }
}
async function pluginToggle(el){
  const key=el.dataset.pkey, enable = el.dataset.enabled!=="1";  // 当前启用→点击=禁用
  el.disabled=true; el.textContent=enable?"启用中…":"禁用中…";
  const r=await call({cmd:"toggle_plugin", name:key, enabled:enable});
  if(r&&r.ok){
    const note=(r.data&&r.data.note)||(enable?"已启用":"已禁用");
    showToast((enable?"已启用「":"已禁用「")+key+"」· "+note);
    await loadPluginSidebar();
    const np=(PLUGIN_STATE.installed||[]).find(x=>x.name===key);
    if(np) reopenPluginDetail(np, true);
  } else {
    el.disabled=false; el.textContent=enable?"启用":"禁用";
    showToast("操作失败："+((r&&r.error&&r.error.message)||"未知错误"));
  }
}
// 详情复位/重开（安装/卸载后刷新详情面板 + 同步侧栏高亮）
function resetPluginDetail(){
  const t=findTab&&findTab("plugins"); if(t) t.view.querySelector(".pg-detail").innerHTML='<div class="pg-empty">← 在左侧插件列表中选择一个插件查看详情</div>';
}
function reopenPluginDetail(p, installed){
  openPluginDetail(p, installed);
  // 同步侧栏选中高亮到对应行
  document.querySelectorAll("#pg-list .pg-item.sel").forEach(x=>x.classList.remove("sel"));
  const row=document.querySelector('#pg-list .pg-item[data-pkey="'+(window.CSS&&CSS.escape?CSS.escape(p.name):p.name)+'"][data-pinstalled="'+(installed?"1":"0")+'"]');
  if(row) row.classList.add("sel");
}

// —— 模型选择器（composer 的 ◎ 模型按钮）——
function setModelLabel(name){
  const short = name==="demo" ? "Demo" : name.replace(/^deepseek-/,"").replace(/^gpt-/,"gpt-");
  document.querySelectorAll(".model .mlabel").forEach(s=>s.textContent=short);
}
async function refreshModelLabel(){
  try{ const r=await call({cmd:"list_models"}); if(r&&r.ok) setModelLabel(r.data.current); }catch(e){}
}
async function openModelMenu(el){
  const menu=document.getElementById("modelmenu");
  if(menu.classList.contains("on")){ menu.classList.remove("on"); return; }
  closeMenu();
  const r=await call({cmd:"list_models"});
  if(!r||!r.ok){ showToast("取模型列表失败"); return; }
  const d=r.data; const cur=d.current;
  const head=`<div class="mm-head">${esc(d.provider||"模型")}${d.baseUrl?` · <span class="mm-b">${esc(d.baseUrl.replace(/^https?:\/\//,""))}</span>`:""}</div>`;
  const items=(d.candidates||[]).map(c=>{
    const on=c.model===cur;
    return `<div class="mi mm-item${on?' on':''}" data-act="setModelChoice" data-model="${esc(c.model)}"><span class="mm-ck">${on?'✓':''}</span> ${esc(c.label||c.model)}</div>`;
  }).join("");
  menu.innerHTML=head+items+(d.configurable?"":`<div class="mm-note">未配置真实模型（model.json/env），仅 demo 可用</div>`)
    +`<div class="mi mm-item" style="margin-top:4px;border-top:1px solid var(--border);padding-top:6px" data-act="openModelConfig">⚙ 配置模型…</div>`;
  // 锚到按钮上方
  const rect=el.getBoundingClientRect();
  menu.style.left=Math.max(8,rect.left)+"px";
  menu.style.bottom=(window.innerHeight-rect.top+6)+"px";
  menu.style.top="auto";
  menu.classList.add("on");
}
async function setModelChoice(el){
  const model=el.dataset.model;
  document.getElementById("modelmenu").classList.remove("on");
  setModelLabel(model);
  const r=await call({cmd:"set_model", model});
  if(r&&r.ok){ showToast("已切换模型 · "+((r.data&&r.data.note)||model)); }
  else { showToast("切换失败："+((r&&r.error&&r.error.message)||"未知")); refreshModelLabel(); }
}

// —— 模型配置面板 ——
const MCFG_PRESETS = {
  mlamp:    "https://llmgw-bz.mlamp.cn/v1",
  deepseek: "https://api.deepseek.com/v1",
  openai:   "https://api.openai.com/v1",
};
const MCFG_CANDIDATES = {
  mlamp:    ["mlamp/deepseek-v4-flash","mlamp/qwen3-coder-next-fp8","mlamp/deepseek-v4-pro","mlamp/glm-5.2","mlamp/kimi-k3","mlamp/qwen3.8-27b","mlamp/minimax-h3"],
  deepseek: ["deepseek-v4-flash","deepseek-v4-pro","deepseek-r1","deepseek-chat"],
  openai:   ["gpt-4o","gpt-4o-mini","o1","o1-mini"],
};
let _mcfgKeyUnlocked = false;

async function openModelConfig(){
  closeMenu();
  _mcfgKeyUnlocked = false;
  const keyInput = document.getElementById("mcfg-api-key");
  const lockBtn  = document.getElementById("mcfg-key-lock-btn");
  keyInput.readOnly = true; keyInput.type = "password";
  lockBtn.textContent = "🔒";
  const r = await call({cmd:"get_model_config"});
  if(!r||!r.ok){ showToast("读取配置失败"); return; }
  const d = r.data;
  document.getElementById("mcfg-base-url").value  = d.base_url    || "";
  keyInput.value                                   = d.api_key_masked || "";
  document.getElementById("mcfg-model").value      = d.model       || "";
  const temp = typeof d.temperature === "number" ? d.temperature : 0.2;
  document.getElementById("mcfg-temp").value       = temp;
  document.getElementById("mcfg-temp-val").textContent = temp.toFixed(2);
  document.getElementById("mcfg-timeout").value    = d.timeout_ms  || 60000;
  mcfgSetPreset(d.base_url || "");
  mcfgUpdateCandidates(d.candidates || []);
  document.getElementById("mcfg-overlay").classList.remove("hidden");
}
function closeModelConfig(){
  document.getElementById("mcfg-overlay").classList.add("hidden");
}
function mcfgToggleKeyLock(){
  const input = document.getElementById("mcfg-api-key");
  const btn   = document.getElementById("mcfg-key-lock-btn");
  if(_mcfgKeyUnlocked){
    input.readOnly = true; input.type = "password";
    btn.textContent = "🔒"; _mcfgKeyUnlocked = false;
    input.value = ""; // 锁回后清空，防止明文残留
  } else {
    input.readOnly = false; input.type = "text"; input.value = "";
    btn.textContent = "🔓"; _mcfgKeyUnlocked = true;
    input.focus();
  }
}
function mcfgApplyPreset(key){
  if(!key) return;
  document.getElementById("mcfg-base-url").value = MCFG_PRESETS[key] || "";
  mcfgUpdateCandidates(MCFG_CANDIDATES[key] || []);
}
function mcfgSetPreset(url){
  const sel = document.getElementById("mcfg-preset");
  const match = Object.entries(MCFG_PRESETS).find(([,v])=>url.includes(v.replace(/^https?:\/\//,"").split("/")[0]));
  sel.value = match ? match[0] : "";
}
function mcfgRefreshCandidates(){
  const url = document.getElementById("mcfg-base-url").value.toLowerCase();
  const key = Object.keys(MCFG_CANDIDATES).find(k=>url.includes(k));
  mcfgUpdateCandidates(key ? MCFG_CANDIDATES[key] : []);
}
function mcfgUpdateCandidates(list){
  const dl = document.getElementById("mcfg-model-list");
  dl.innerHTML = list.map(m=>`<option value="${esc(m)}">`).join("");
}
async function saveModelConfig(){
  const baseUrl  = document.getElementById("mcfg-base-url").value.trim();
  const model    = document.getElementById("mcfg-model").value.trim();
  const temp     = parseFloat(document.getElementById("mcfg-temp").value);
  const timeout  = parseInt(document.getElementById("mcfg-timeout").value, 10);
  if(!baseUrl){ showToast("Base URL 不能为空"); return; }
  if(!model){   showToast("模型名不能为空");   return; }
  const payload = {cmd:"set_model_config", base_url:baseUrl, model, temperature:temp, timeout_ms:timeout};
  if(_mcfgKeyUnlocked){
    const key = document.getElementById("mcfg-api-key").value.trim();
    payload.api_key_action = "set";
    payload.api_key_value  = key;
  } else {
    payload.api_key_action = "keep";
  }
  const r = await call(payload);
  if(r&&r.ok){
    showToast("已保存 · "+((r.data&&r.data.note)||model));
    refreshModelLabel();
    closeModelConfig();
  } else {
    showToast("保存失败："+((r&&r.error&&r.error.message)||"未知"));
  }
}

// 状态图标（替代 exit 码文字）：成功 ✓ / 失败 ✕
const ICON_CHECK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
const ICON_X=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
// ── 结果面板操作按钮（复制/分享/点赞/差评）：仅图标 + 原生 tooltip（title），注入到 .tchead 右侧 ──
const TOOL_ACT_BTNS =
  `<button class="tcact" data-act="toolCopy" title="复制" aria-label="复制"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>`+
  `<button class="tcact" data-act="toolShare" title="分享" aria-label="分享"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></button>`+
  `<button class="tcact" data-act="toolLike" title="点赞" aria-label="点赞"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></button>`+
  `<button class="tcact" data-act="toolDislike" title="差评" aria-label="差评"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg></button>`;
function addToolActions(card){
  const head=card.querySelector(".tchead");
  if(!head || head.querySelector(".tcacts")) return;
  const acts=document.createElement("span"); acts.className="tcacts"; acts.innerHTML=TOOL_ACT_BTNS;
  const meta=head.querySelector(".tcmeta");
  if(meta){ meta.after(acts); }                              // 跟在「exit N / N 步」右侧
  else { acts.style.marginLeft="auto"; head.appendChild(acts); }  // 无 meta 时按钮组自己靠右
}
// AI 文本气泡：把同款操作按钮作为底部行追加（气泡无表头，放底部）
function addBubbleActions(bubble){
  if(!bubble || !bubble.innerText.trim() || bubble.querySelector(":scope > .tcacts")) return;
  const acts=document.createElement("div"); acts.className="tcacts bubble-acts"; acts.innerHTML=TOOL_ACT_BTNS;
  bubble.appendChild(acts);
}
// 复制/分享取正文文本（去掉操作按钮本身）；工具卡取正文块，气泡取全文
function panelText(box){
  const clone=box.cloneNode(true); clone.querySelectorAll(".tcacts").forEach(a=>a.remove());
  const parts=[...clone.querySelectorAll(".tterm,.tcode,.tcsub,.tcempty")].map(e=>e.innerText.trim()).filter(Boolean);
  if(parts.length) return parts.join("\n\n");
  const tbl=clone.querySelector(".tdata"); if(tbl) return tbl.innerText.trim();
  return clone.innerText.trim();
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){ try{ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); return true; }catch(_){ return false; } }
}
async function toolCopy(btn){ const ok=await copyText(panelText(btn.closest(".tool,.bubble"))); showToast(ok?"已复制到剪贴板":"复制失败"); }
async function toolShare(btn){
  const txt=panelText(btn.closest(".tool,.bubble"));
  if(navigator.share){ try{ await navigator.share({text:txt}); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
  const ok=await copyText(txt); showToast(ok?"已复制，可粘贴分享":"分享失败");
}
function toolLike(btn){
  const box=btn.closest(".tool,.bubble"); const dis=box.querySelector('[data-act="toolDislike"]');
  const on=btn.classList.toggle("liked"); if(on&&dis) dis.classList.remove("disliked");
  showToast(on?"已点赞 👍":"已取消点赞");
}
function toolDislike(btn){
  const box=btn.closest(".tool,.bubble"); const lk=box.querySelector('[data-act="toolLike"]');
  const on=btn.classList.toggle("disliked"); if(on&&lk) lk.classList.remove("liked");
  showToast(on?"已记录反馈，谢谢":"已取消差评");
}
function showToast(msg){
  let t=document.getElementById("cmx-toast");
  if(!t){ t=document.createElement("div"); t.id="cmx-toast"; t.className="cmx-toast"; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("on");
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove("on"),1600);
}

// 内联 onclick 属性全被拦截。用委托（监听在 document 上，由 nonce'd 脚本注册）在两壳都工作。
const ACTIONS = { newTask, openConnectors, startFromHome, toggleSidebar, toggleTheme, checkUpdate, applyUpdate, toggleMenu, menuSettings, menuAbout, toggleVoice, toggleUserMenu, userProfile, imBinding, userSwitch, userWorkspace, userLogout,
  toggleTabOverflow, tabCtxClose, tabCtxCloseOthers, tabCtxCloseRight, tabCtxCloseAll, winMinimize, winToggleMaximize, winClose,
  closeSettings, scfgSecretLock: scfgToggleSecretLock, scfgTgLock: scfgToggleTgLock, imcfgTest, imcfgSave };
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(!el){ closeMenu(); closeTabCtx(); document.getElementById("modelmenu").classList.remove("on"); document.getElementById("tab-dropdown").classList.remove("on"); return; }
  const act = el.dataset.act;
  if(act === "runConnectorTool"){
    runConnectorTool(el.dataset.tool, el.dataset.online === "1");
  } else if(act === "approveTool"){
    approveTool(el.dataset.callid, el.dataset.ok === "1", el.dataset.all === "1");
  } else if(act === "toolCopy"){ toolCopy(el);
  } else if(act === "toolShare"){ toolShare(el);
  } else if(act === "toolLike"){ toolLike(el);
  } else if(act === "toolDislike"){ toolDislike(el);
  } else if(act === "pluginSelect"){ pluginSelect(el);
  } else if(act === "pluginOpenHomepage"){ pluginOpenHomepage(el);
  } else if(act === "pluginInstall"){ pluginInstall(el);
  } else if(act === "pluginUninstall"){ pluginUninstall(el);
  } else if(act === "pluginToggle"){ pluginToggle(el);
  } else if(act === "openModelMenu"){ openModelMenu(el);
  } else if(act === "setModelChoice"){ setModelChoice(el);
  } else if(act === "openModelConfig"){ closeMenu(); openModelConfig();
  } else if(act === "toggleVoice"){
    toggleVoice(el);
  } else if(act === "showPanel"){
    showPanel(el.dataset.panel);
  } else if(ACTIONS[act]){
    ACTIONS[act]();
  }
});

// 左侧栏宽度可调：拖动 .splitter，宽度存 localStorage，clamp [200,480]
(function initSplitter(){
  const sp=document.getElementById("splitter"), root=document.documentElement;
  try{ const w=localStorage.getItem("cmx-aside-w"); if(w) root.style.setProperty("--aside-w", w+"px"); }catch(e){}
  let startX=0, startW=0, dragging=false;
  const curW=()=>parseInt(getComputedStyle(root).getPropertyValue("--aside-w"))||270;
  sp.addEventListener("pointerdown", e=>{
    dragging=true; startX=e.clientX; startW=curW();
    sp.classList.add("dragging"); sp.setPointerCapture(e.pointerId);
    document.body.style.userSelect="none";
  });
  sp.addEventListener("pointermove", e=>{
    if(!dragging) return;
    const w=Math.max(200,Math.min(480, startW+(e.clientX-startX)));
    root.style.setProperty("--aside-w", w+"px");
  });
  const end=()=>{ if(!dragging) return; dragging=false; sp.classList.remove("dragging"); document.body.style.userSelect="";
    try{ localStorage.setItem("cmx-aside-w", curW()); }catch(e){} };
  sp.addEventListener("pointerup", end); sp.addEventListener("pointercancel", end);
})();

// 启动：初始化 tab 条（空态显示首页）、更新按钮（默认隐藏）、当前用户，聚焦输入框
(async()=>{ renderUpdateBtn(); refreshUser(); refreshModelLabel(); await refreshTasks(); renderTabs(); document.getElementById("inp").focus(); })();

// 登录后主窗口被显示时刷新用户信息：原生壳监听 Tauri "logged-in" 事件；并兜底监听窗口 focus。
if(window.__TAURI__ && window.__TAURI__.event){ window.__TAURI__.event.listen("logged-in", ()=>refreshUser()); }
window.addEventListener("focus", ()=>{ refreshUser(); });

// 会话事件总线实时通道（U16）：任意来源（本地 / IM 桥）的会话事件广播给前端，按 session_id 分流渲染。
// 这是「飞书发消息实时显示到对话界面」的最后一公里——IM 无关，微信/钉钉接入后走同一条路。
if(window.__TAURI__ && window.__TAURI__.event){
  window.__TAURI__.event.listen("session_event", e => {
    try { console.log("[session_event] recv", JSON.stringify(e && e.payload)); } catch(err){ console.log("[session_event] recv (unserializable)", e && e.payload); }
    onSessionEvent(e.payload);
  });
  console.log("[session_event] 监听已注册");
} else {
  console.log("[session_event] 未注册：window.__TAURI__.event 不可用");
}
