<!DOCTYPE html>
<!-- cmx-agent 桌面前端（双壳单份真源）。两栏布局（对齐 WorkBuddy）：左侧栏(品牌/新建/导航/会话列表/用户) + 主区(首页引导 ↔ 会话)。
     ★ 本文件是唯一真源：Web 壳（本 crate，include_str! 内嵌）与 Tauri 壳（cmx-agent-shell/src-tauri/ui/）共用同一份。
     后端交互走双桥：有 window.__TAURI__ 时 invoke("agent")，否则 POST /api——两者同达 dispatch_json。
     桌面形态内容（自绘窗口三键 win-ctrls / 8 向缩放热区）默认 display:none，由 initPlatformChrome 探测非 macOS 且在 Tauri 壳内才启用，浏览器中无害。
     改动后跑仓根 ./sync-ui.sh 发布到 Tauri 壳；勿直接改 src-tauri/ui/ 下的副本（生成物）。 -->
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cmx 企业桌面智能体</title>
<style>
  :root{
    --bg:#0d0d0d; --panel:#141414; --panel2:#1a1a19; --surface:#1e1e1d; --hover:#242423;
    --ink:#f2f1ec; --ink2:#b8b7ae; --muted:#7d7c76; --border:#2a2a28; --border2:#333330;
    --blue:#3987e5; --aqua:#1fb182; --violet:#9085e9; --magenta:#d55181; --orange:#eb6834;
    --green:#22c55e; --red:#e5605f; --accent:#1fb182;
    --accent-soft:#17362b;
    --header-h:36px;
    --aside-w:270px;
  }
  /* 浅色主题（dataviz light 令牌）——由标题栏主题开关切换 html[data-theme] */
  html[data-theme="light"]{
    --bg:#f4f4f2; --panel:#ffffff; --panel2:#f7f7f5; --surface:#ffffff; --hover:#ececea;
    --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --border:#e4e3dc; --border2:#d6d5ce;
    --blue:#2a78d6; --aqua:#1baf7a; --violet:#4a3aa7; --magenta:#e87ba4; --orange:#eb6834;
    --green:#0ca30c; --red:#e34948; --accent:#1baf7a; --accent-soft:#e3f5ee;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;overflow:hidden;font-size:14px}
  /* 顶部工作区（活动栏 + 侧栏 + 主区）在原生标题条之下 */
  .workspace{flex:1;display:flex;min-height:0}

  /* ── 最左活动栏（VSCode 式）：Agent / 即时通讯 / 插件管理 ── */
  .activitybar{width:52px;flex:0 0 52px;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px}
  .act{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:20px;color:var(--muted);position:relative;background:transparent}
  .act:hover{background:var(--hover);color:var(--ink)}
  .act.active{color:var(--aqua)}
  .act.active::before{content:"";position:absolute;left:-8px;top:9px;width:3px;height:22px;border-radius:2px;background:var(--aqua)}
  .act .badge{position:absolute;top:5px;right:5px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
    background:var(--red);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .act-sp{flex:1}
  /* 活动栏底部 cmx 按钮（图片） */
  .cmx-act{padding:0;overflow:hidden}
  .cmx-act img{width:30px;height:30px;border-radius:8px;object-fit:cover;display:block}
  .cmx-act:hover{background:var(--hover)}
  /* 活动栏底部用户头像按钮 */
  .user-act{padding:0}
  .user-act .uic{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--aqua),var(--green));
    display:flex;align-items:center;justify-content:center;font-size:16px}
  .user-act:hover{background:var(--hover)}
  /* 用户菜单头部 */
  .usermenu{min-width:220px;bottom:52px}
  .um-head{display:flex;align-items:center;gap:10px;padding:8px 9px}
  .um-av{width:40px;height:40px;border-radius:50%;flex:0 0 40px;background:linear-gradient(135deg,var(--aqua),var(--green));
    display:flex;align-items:center;justify-content:center;font-size:20px}
  .um-info{min-width:0}
  .um-name{font-weight:700;font-size:14px} .um-mail{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .um-danger{color:var(--red)} .um-danger:hover{background:rgba(227,73,72,.12)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

  /* 原生标题条：贯穿窗口顶部一整行，与系统交通灯同一行（Overlay 标题栏）。
     整条可拖动（app-region: drag）；左侧留 78px 给交通灯；右侧放控件（控件本身设 no-drag）。
     左侧 82px 留白仅 macOS 需要（系统红绿灯浮在其上）；Windows/Linux 无原生装饰，JS 加 .no-native-decor
     后去掉左 padding，标题条左对齐、右侧改放自绘窗口控件（.win-ctrls）。 */
  .titlebar{height:32px;flex:0 0 32px;display:flex;align-items:center;
    background:var(--panel);border-bottom:1px solid var(--border);
    padding:0 10px 0 82px;-webkit-app-region:drag;user-select:none}
  body.no-native-decor .titlebar{padding-left:12px}
  .titlebar .tb-title{font-size:12.5px;color:var(--muted);font-weight:600}
  .titlebar .sp{flex:1}
  .tb-ctrls{display:flex;align-items:center;gap:3px;-webkit-app-region:no-drag}
  .tb-btn{display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:7px;color:var(--ink2);
    font-size:12.5px;background:transparent;border:1px solid transparent}
  .tb-btn:hover{background:var(--hover);color:var(--ink);border-color:var(--border)}
  .tb-btn .ico{font-size:14px;line-height:1}
  .tb-update{color:var(--aqua)} .tb-update:hover{border-color:var(--aqua)}
  /* Windows/Linux 窗口控件（最小化/最大化/关闭）：默认隐藏，initPlatformChrome 探测非 macOS 后 display:flex */
  .win-ctrls{display:flex;align-items:center;-webkit-app-region:no-drag;margin-left:4px}
  .win-btn{display:flex;align-items:center;justify-content:center;width:44px;height:32px;color:var(--ink2);border-radius:0}
  .win-btn:hover{background:var(--hover);color:var(--ink)}
  .win-btn.win-close:hover{background:#e34948;color:#fff}
  .win-btn .ico{font-size:12px;line-height:1}
  /* 无系统边框缩放热区：仅 Windows/Linux 显示（initPlatformChrome 控制），macOS 用系统边框缩放 */
  .resize-handle{position:fixed;z-index:9999;display:none}
  body.no-native-decor .resize-handle{display:block}
  .rh-t{top:0;left:10px;right:10px;height:6px;cursor:n-resize}
  .rh-b{bottom:0;left:10px;right:10px;height:6px;cursor:s-resize}
  .rh-l{top:10px;bottom:10px;left:0;width:6px;cursor:w-resize}
  .rh-r{top:10px;bottom:10px;right:0;width:6px;cursor:e-resize}
  .rh-tl{top:0;left:0;width:10px;height:10px;cursor:nw-resize}
  .rh-tr{top:0;right:0;width:10px;height:10px;cursor:ne-resize}
  .rh-bl{bottom:0;left:0;width:10px;height:10px;cursor:sw-resize}
  .rh-br{bottom:0;right:0;width:10px;height:10px;cursor:se-resize}
  /* 侧栏折叠 */
  body.sidebar-collapsed aside{display:none}

  /* ── 左侧栏 ── */
  aside{width:var(--aside-w);flex:0 0 var(--aside-w);background:var(--panel);
    display:flex;flex-direction:column;padding:0 10px;position:relative}
  /* 左右分栏拖动条：单条分隔线（取代 aside 右边框），中间有可拖动手柄 */
  .splitter{flex:0 0 6px;align-self:stretch;cursor:col-resize;position:relative;z-index:5;background:transparent}
  .splitter::before{content:"";position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:1px;background:var(--border)}
  .splitter::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:4px;height:34px;border-radius:3px;background:var(--border2);transition:background .15s,height .15s}
  .splitter:hover::after,.splitter.dragging::after{background:var(--aqua);height:52px}
  body.sidebar-collapsed .splitter{display:none}
  /* 三面板：同一时刻只显示一个 */
  .panel{display:none;flex-direction:column;flex:1;min-height:0}
  .panel.on{display:flex}
  /* IM / 插件 面板共用件 */
  .im-search{padding:8px 4px}
  .im-search input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:9px;
    padding:8px 11px;color:var(--ink);font-size:13px;outline:none;font-family:inherit}
  .im-search input:focus{border-color:var(--aqua)}
  .im-list,.plug-list{flex:1;overflow:auto;margin:0 -4px}
  /* Telegram 式会话行 */
  .im-item{display:flex;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer}
  .im-item:hover{background:var(--hover)}
  .im-item .av{width:40px;height:40px;border-radius:50%;flex:0 0 40px;display:flex;align-items:center;justify-content:center;
    font-size:19px;color:#fff}
  .im-item .mid{flex:1;min-width:0}
  .im-item .r1{display:flex;align-items:center;gap:6px} .im-item .nm{font-weight:600;font-size:13.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .im-item .tm{font-size:11px;color:var(--muted);flex:0 0 auto}
  .im-item .r2{display:flex;align-items:center;gap:6px;margin-top:2px}
  .im-item .msg{flex:1;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .im-item .unread{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--aqua);color:#fff;
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  /* VSCode 式插件行 */
  .plug-sec{font-size:11px;font-weight:700;color:var(--muted);padding:12px 8px 5px;letter-spacing:.5px}
  .plug-item{display:flex;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer}
  .plug-item:hover{background:var(--hover)}
  .plug-item .pic{width:38px;height:38px;border-radius:9px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;
    font-size:19px;color:#fff}
  .plug-item .pm{flex:1;min-width:0}
  .plug-item .pn{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plug-item .pd{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .plug-item .pmeta{font-size:11px;color:var(--muted);margin-top:3px}
  .plug-item .pbtn{align-self:center;font-size:11.5px;padding:4px 10px;border-radius:7px;border:1px solid var(--border2);color:var(--ink2);flex:0 0 auto}
  .plug-item .pbtn.installed{color:var(--aqua);border-color:var(--aqua)}
  .plug-item .pbtn:hover{background:var(--hover)}
  .brand{display:flex;align-items:center;gap:9px;height:var(--header-h);box-sizing:border-box;
    margin:0 -10px;padding:0 14px;border-bottom:1px solid var(--border)}
  .brand .uav{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--aqua),var(--green));
    display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 26px}
  .brand .uname{font-weight:700;font-size:14px} .brand .v{color:var(--muted);font-size:11px;margin-left:auto;font-weight:400}
  .newbtn{display:flex;align-items:center;gap:9px;width:100%;padding:11px 12px;border-radius:10px;
    background:var(--surface);border:1px solid var(--border2);font-weight:600;font-size:14px;margin:12px 0 8px}
  .newbtn:hover{background:var(--hover)} .newbtn .plus{font-size:17px;color:var(--aqua)}
  nav{display:flex;flex-direction:column;gap:1px}
  .navitem{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--ink2);font-size:14px}
  .navitem:hover{background:var(--hover);color:var(--ink)} .navitem .i{width:17px;text-align:center;opacity:.85}
  .navitem .tag{margin-left:auto;font-size:11px;color:var(--muted)}
  .seclabel{color:var(--muted);font-size:12px;font-weight:600;padding:14px 12px 6px;display:flex;align-items:center;gap:6px}
  .seclabel .c{color:var(--ink2)}
  .tasklist{flex:1;overflow:auto;margin:0 -2px}
  .task{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:var(--ink2);font-size:13.5px}
  .task:hover{background:var(--hover);color:var(--ink)} .task.active{background:var(--surface);color:var(--ink)}
  .task .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task .tm{font-size:11px;color:var(--muted);flex:0 0 auto}
  .task .del{opacity:0;color:var(--muted);font-size:14px;padding:0 2px} .task:hover .del{opacity:.7} .task .del:hover{color:var(--red);opacity:1}
  .empty-tasks{color:var(--muted);font-size:12.5px;padding:10px 12px;line-height:1.7}
  .promo{margin:8px -2px 8px;padding:12px;border-radius:10px;background:linear-gradient(135deg,#12241d,#0f1a17);
    border:1px solid var(--border2);position:relative}
  .promo .x{position:absolute;top:8px;right:10px;color:var(--muted);font-size:13px}
  .promo .pt{font-weight:600;font-size:13px;margin-bottom:3px} .promo .ps{color:var(--ink2);font-size:12px}
  .promo .ps b{color:var(--green)} .promo .pb{margin-top:9px;padding:6px 12px;border-radius:7px;background:#fff;color:#111;font-weight:700;font-size:12px}
  .userbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);margin:0 -10px;position:relative}
  .cmxbtn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;overflow:hidden;padding:0}
  .cmxbtn:hover{filter:brightness(1.08)} .cmxbtn img{width:100%;height:100%;object-fit:cover;display:block}
  .userbar .ic-group{margin-left:auto;display:flex;align-items:center;gap:4px}
  .userbar .ic{color:var(--muted);font-size:15px;padding:4px 5px;border-radius:7px} .userbar .ic:hover{color:var(--ink);background:var(--hover)}
  /* cmx 功能菜单（点左下 cmx 按钮弹出） */
  .cmxmenu{position:fixed;left:56px;bottom:10px;min-width:180px;background:var(--panel);
    border:1px solid var(--border2);border-radius:10px;padding:5px;box-shadow:0 8px 28px rgba(0,0,0,.35);
    display:none;z-index:60}
  .cmxmenu.on{display:block}
  .cmxmenu .mi{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;font-size:13.5px;color:var(--ink2)}
  .cmxmenu .mi:hover{background:var(--hover);color:var(--ink)}
  .cmxmenu .mi-i{width:16px;text-align:center;font-size:14px}
  .cmxmenu .mi-sep{height:1px;background:var(--border);margin:5px 8px}
  /* 模型选择弹层（锚在 composer 模型按钮上方；left/bottom 由 JS 定位） */
  .modelmenu{left:auto;bottom:auto;min-width:240px;max-height:60vh;overflow:auto}
  .modelmenu .mm-head{font-size:11.5px;color:var(--muted);padding:4px 11px 6px;font-weight:600}
  .modelmenu .mm-head .mm-b{color:var(--border2);font-weight:400}
  .modelmenu .mm-item{cursor:pointer}
  .modelmenu .mm-item.on{color:var(--aqua)}
  .modelmenu .mm-ck{width:14px;text-align:center;color:var(--aqua)}
  .modelmenu .mm-note{font-size:11px;color:var(--muted);padding:6px 11px}
  .model .mdot{color:var(--aqua)} .model .mlabel{font-weight:600}

  /* ── 模型配置面板 ── */
  .mcfg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center}
  .mcfg-overlay.hidden{display:none}
  .mcfg-box{background:var(--panel);border:1px solid var(--border2);border-radius:14px;padding:22px 24px 18px;width:min(480px,92vw);box-shadow:0 16px 48px rgba(0,0,0,.5)}
  .mcfg-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;font-weight:700;font-size:15px}
  .mcfg-head button{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 6px;border-radius:5px}
  .mcfg-head button:hover{background:var(--hover);color:var(--ink)}
  .mcfg-row{display:flex;flex-direction:column;gap:4px;margin-bottom:13px}
  .mcfg-row label{font-size:11.5px;color:var(--muted);font-weight:600}
  .mcfg-row input[type=text],.mcfg-row input[type=number],.mcfg-row select{background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:7px 10px;color:var(--ink);font-size:13px;width:100%;box-sizing:border-box}
  .mcfg-row input[type=text]:focus,.mcfg-row input[type=number]:focus,.mcfg-row select:focus{outline:none;border-color:var(--aqua)}
  .mcfg-key-wrap{display:flex;gap:6px;align-items:center}
  .mcfg-key-wrap input{flex:1}
  .mcfg-key-wrap button{background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:6px 10px;color:var(--muted);cursor:pointer;font-size:15px;flex:0 0 auto}
  .mcfg-key-wrap button:hover{color:var(--aqua);border-color:var(--aqua)}
  .mcfg-temp-row{display:flex;align-items:center;gap:10px}
  .mcfg-temp-row input[type=range]{flex:1;accent-color:var(--aqua)}
  .mcfg-temp-val{min-width:36px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .mcfg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
  .mcfg-actions button{padding:7px 18px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid var(--border2);background:var(--bg);color:var(--ink)}
  .mcfg-actions .mcfg-save{background:var(--aqua);border-color:var(--aqua);color:#000;font-weight:600}
  .mcfg-actions .mcfg-save:hover{opacity:.88}

  /* ── 主区 ── */
  main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  /* ── 顶部多 tab 条 ── */
  .tabbar{display:flex;align-items:stretch;height:var(--header-h);box-sizing:border-box;border-bottom:1px solid var(--border);background:var(--panel)}
  .tabstrip{flex:1;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden}
  .tabstrip::-webkit-scrollbar{height:0}
  .tab{display:flex;align-items:center;gap:7px;padding:0 9px 0 13px;max-width:200px;border-right:1px solid var(--border);
    color:var(--ink2);font-size:13px;cursor:pointer;position:relative;flex:0 0 auto;background:transparent}
  .tab:hover{background:var(--hover)}
  .tab.active{background:var(--bg);color:var(--ink)}
  .tab.active::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--aqua)}
  .tab .tab-ico{font-size:13px;flex:0 0 auto}
  .tab .tab-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tab .tab-x{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--muted);flex:0 0 auto;opacity:.6}
  .tab .tab-x:hover{background:var(--border2);color:var(--ink);opacity:1}
  .tab-overflow{width:36px;flex:0 0 36px;border-left:1px solid var(--border);color:var(--ink2);font-size:15px}
  .tab-overflow:hover{background:var(--hover);color:var(--ink)}
  .tab-dropdown{position:absolute;top:calc(var(--header-h) + 4px);right:14px;min-width:220px;max-height:60vh;overflow:auto;
    background:var(--panel);border:1px solid var(--border2);border-radius:10px;padding:5px;box-shadow:0 8px 28px rgba(0,0,0,.35);display:none;z-index:60}
  .tab-dropdown.on{display:block}
  .tab-dd-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--ink2);cursor:pointer}
  .tab-dd-item:hover{background:var(--hover);color:var(--ink)} .tab-dd-item.active{color:var(--aqua)}
  .tab-dd-item .ddx{margin-left:auto;color:var(--muted);opacity:.6} .tab-dd-item .ddx:hover{color:var(--red);opacity:1}
  /* tab 右键菜单复用 .cmxmenu，但用固定定位（JS 设 left/top）*/
  .tabctx{position:fixed;bottom:auto}

  /* 空态默认内容（无 tab 时显示）*/
  #home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px;overflow:auto}
  #home.off{display:none}
  #home .hero{font-size:34px;font-weight:700;margin-bottom:26px;text-align:center;letter-spacing:1px}
  #home .hero .g{background:linear-gradient(90deg,var(--aqua),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
  .cats{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
  .cat{display:flex;align-items:center;gap:7px;padding:9px 18px;border-radius:22px;background:var(--surface);
    border:1px solid var(--border2);color:var(--ink2);font-size:14px}
  .cat.active{background:var(--accent-soft);border-color:var(--aqua);color:var(--aqua);font-weight:600}
  .cat:hover{background:var(--hover)}
  .quick{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;justify-content:center;max-width:820px}
  .qa{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--panel2);
    border:1px solid var(--border);color:var(--ink2);font-size:13.5px}
  .qa:hover{background:var(--hover);color:var(--ink);border-color:var(--border2)}
  .composer{width:100%;max-width:820px;background:var(--panel2);border:1px solid var(--border2);border-radius:16px;padding:16px 18px}
  .composer.big{min-height:150px;display:flex;flex-direction:column}
  #inp{width:100%;background:none;border:none;outline:none;color:var(--ink);font-size:15px;resize:none;
    font-family:inherit;line-height:1.5;flex:1;min-height:64px}
  #inp::placeholder{color:var(--muted)}
  .composer .crow{display:flex;align-items:center;margin-top:10px;gap:10px}
  .composer .add{width:30px;height:30px;border-radius:8px;background:var(--surface);color:var(--ink2);font-size:17px;
    display:flex;align-items:center;justify-content:center} .composer .add:hover{background:var(--hover)}
  .composer .sp{flex:1}
  .composer .model{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px;padding:6px 10px;border-radius:8px}
  .composer .model:hover{background:var(--hover)}
  .composer .send{width:34px;height:34px;border-radius:50%;background:var(--surface);color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:15px}
  .composer .send:hover{background:var(--aqua);color:#052} .composer .send:disabled{opacity:.4}
  .selectors{display:flex;gap:14px;margin-top:12px;max-width:820px;width:100%}
  .selbtn{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;color:var(--ink2);font-size:13px;border:1px solid transparent}
  .selbtn:hover{background:var(--panel2);border-color:var(--border)}
  .selbtn select{background:none;border:none;color:var(--ink2);font-family:inherit;font-size:13px;outline:none;cursor:pointer}
  .selbtn select option{background:var(--panel2)}

  /* 会话态 */
  /* tab 内容容器：每个 tab 一个 .tabview，只 active 的显示 */
  #tabviews{flex:1;display:none;min-height:0}
  #tabviews.on{display:block}
  .tabview{display:none;height:100%;flex-direction:column;min-height:0}
  .tabview.active{display:flex}
  .session-view{flex:1;display:flex;flex-direction:column;min-height:0}
  .log{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:11px}
  .row{display:flex;gap:10px}
  .row.user{align-self:flex-end;flex-direction:row-reverse;max-width:80%}
  /* AI 气泡撑满该行（与工具卡片同宽），使整列内容左对齐、右边界一致；用户气泡仍随内容收缩 */
  .row:not(.user){align-self:stretch}
  .row:not(.user) .bubble{flex:1 1 auto;min-width:0}
  .avatar{width:30px;height:30px;border-radius:8px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
  .avatar.u{background:var(--magenta)} .avatar.a{background:var(--blue)}
  .bubble{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  /* markdown 气泡：内部用块级排版，不再 pre-wrap（由各元素自管）*/
  .bubble.md{white-space:normal}
  .bubble.md>:first-child{margin-top:0} .bubble.md>:last-child{margin-bottom:0}
  .bubble.md .md-h{margin:14px 0 8px;line-height:1.3;font-weight:700}
  .bubble.md h1.md-h{font-size:20px} .bubble.md h2.md-h{font-size:18px;border-bottom:1px solid var(--border);padding-bottom:5px}
  .bubble.md h3.md-h{font-size:16px} .bubble.md h4.md-h{font-size:14.5px} .bubble.md h5.md-h,.bubble.md h6.md-h{font-size:13.5px;color:var(--ink2)}
  .bubble.md .md-p{margin:8px 0}
  .bubble.md .md-ul,.bubble.md .md-ol{margin:8px 0;padding-left:22px} .bubble.md .md-ul li,.bubble.md .md-ol li{margin:3px 0}
  .bubble.md .md-quote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--aqua);color:var(--ink2);background:var(--panel2);border-radius:0 8px 8px 0}
  .bubble.md .md-hr{border:none;border-top:1px solid var(--border);margin:12px 0}
  .bubble.md code{font-family:"SF Mono",Menlo,monospace;font-size:12.5px;background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:1px 5px}
  .bubble.md .md-pre{margin:10px 0;background:var(--bg2,#0d1420);border:1px solid var(--border);border-radius:10px;padding:12px 14px;overflow:auto}
  .bubble.md .md-pre code{background:none;border:none;padding:0;font-size:12.5px;line-height:1.5;color:var(--ink);white-space:pre}
  .bubble.md a{color:var(--aqua);text-decoration:none} .bubble.md a:hover{text-decoration:underline}
  .bubble.md .md-table{border-collapse:collapse;margin:10px 0;font-size:13px;display:block;overflow-x:auto}
  .bubble.md .md-table th,.bubble.md .md-table td{border:1px solid var(--border2);padding:6px 11px;text-align:left}
  .bubble.md .md-table th{background:var(--panel2);font-weight:700;color:var(--ink)}
  .bubble.md .md-table tr:nth-child(even) td{background:var(--panel2)}
  .row.user .bubble{background:var(--blue);color:#fff;border-color:transparent}
  .tool{align-self:flex-start;width:calc(100% - 40px);margin-left:40px;min-width:0;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--ink2)}
  .tool.denied{border-color:var(--red)}
  .tool .tchead{display:flex;align-items:center;gap:7px;font-size:12.5px} .tool .tchead b{color:var(--aqua)} .tool.denied .tchead b{color:var(--red)}
  .tool .tcpath{font-family:"SF Mono",Menlo,monospace;font-size:11.5px;color:var(--ink2)} .tool .tcmeta{margin-left:auto;color:var(--muted);font-size:11px}
  .tool .tterm{margin:7px 0 2px;background:#0a0e14;border:1px solid var(--border);border-radius:8px;padding:9px 12px;
    font-family:"SF Mono",Menlo,monospace;font-size:11.5px;line-height:1.5;color:#c8d3e0;white-space:pre;overflow:auto;max-height:340px}
  .tool .tterm.tterr{color:var(--red)}
  .tool .tcode{margin:7px 0 2px;background:var(--bg2,#0d1420);border:1px solid var(--border);border-radius:8px;padding:9px 12px;
    font-family:"SF Mono",Menlo,monospace;font-size:11.5px;line-height:1.5;color:var(--ink);white-space:pre;overflow:auto;max-height:340px}
  .tool .tcempty{color:var(--muted);font-size:11.5px;margin-top:5px}
  /* U10 web_search 结果条 + web_fetch 页头 */
  .tool .wsr{margin:8px 0;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
  .tool .wsr .wsr-t{font-size:13.5px;font-weight:600;color:var(--aqua);line-height:1.4}
  .tool .wsr .wsr-u{font-size:11px;color:var(--muted);font-family:"SF Mono",Menlo,monospace;margin:2px 0;word-break:break-all}
  .tool .wsr .wsr-s{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-top:3px}
  .tool .wf-title{font-size:14px;font-weight:700;color:var(--ink);margin:7px 0 2px}
  .tool .wf-url{font-size:11px;color:var(--muted);font-family:"SF Mono",Menlo,monospace;margin-bottom:4px;word-break:break-all}
  /* U8 computer_use 轨迹 */
  .tool .cutrace{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}
  .tool .cuact{font-size:11.5px;font-family:"SF Mono",Menlo,monospace;color:var(--ink2);background:var(--panel);border:1px solid var(--border2);border-radius:6px;padding:2px 8px}
  /* U12 企业域模型分组 */
  .tool .ecrow{display:flex;gap:8px;align-items:baseline;margin:6px 0}
  .tool .ecrow .ecl{flex:0 0 64px;font-size:12px;color:var(--muted)} .tool .ecrow .ecl b{color:var(--aqua)}
  .tool .ecrow .ecc{display:flex;flex-wrap:wrap;gap:5px}
  /* P3/U7 图表 + 数据概览 */
  .tool .tchartimg{margin:8px 0 2px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px;overflow:auto}
  .tool .tchartimg img{display:block;max-width:100%;height:auto}
  .tool .tdata{border-collapse:collapse;margin:7px 0 2px;font-size:11.5px;width:100%}
  .tool .tdata th,.tool .tdata td{border:1px solid var(--border2);padding:4px 9px;text-align:left;color:var(--ink2)}
  .tool .tdata th{background:var(--panel2);color:var(--ink);font-weight:700}
  /* U5 红绿 diff（fs_edit / apply_patch）*/
  .tool .tdiff{margin:7px 0 2px;background:#0a0e14;border:1px solid var(--border);border-radius:8px;padding:8px 0;
    font-family:"SF Mono",Menlo,monospace;font-size:11.5px;line-height:1.55;overflow:auto;max-height:360px}
  .tool .tdiff .dl{display:block;padding:0 12px;white-space:pre-wrap;word-break:break-word}
  .tool .tdiff .add{color:#7ee2b8;background:rgba(34,197,94,.12)}
  .tool .tdiff .del{color:#f0a0a0;background:rgba(229,96,95,.12)}
  .tool .tdiff .hunk{color:var(--violet)} .tool .tdiff .ctx{color:var(--ink2)}
  /* 子智能体 task 块：任务描述 + 最终回答 */
  .tool .tcsub{margin:7px 0 2px;background:var(--panel);border:1px solid var(--violet);border-left:3px solid var(--violet);
    border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--ink2);line-height:1.55}
  .tool .tcsub.md{color:var(--ink)}
  /* 人在环审批卡片（X4）*/
  .tool.approval{border-color:var(--gold);background:linear-gradient(180deg,rgba(229,185,95,.06),transparent)}
  .tool.approval .tchead b{color:var(--gold)}
  .tool .apreason{margin:6px 0 10px;font-size:12.5px;color:var(--ink2);line-height:1.5}
  .tool .aprow{display:flex;gap:9px}
  .tool .apbtn{flex:0 0 auto;padding:7px 18px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--panel)}
  .tool .apbtn.allow{background:linear-gradient(135deg,var(--aqua),var(--green2));color:#fff;border-color:transparent}
  .tool .apbtn.allow:hover{filter:brightness(1.08)}
  .tool .apbtn.reject{color:var(--ink2)} .tool .apbtn.reject:hover{border-color:var(--red);color:var(--red)}
  .tool .apbtn.allowall{color:var(--gold);border-color:var(--border2)} .tool .apbtn.allowall:hover{border-color:var(--gold);background:rgba(229,185,95,.10)}
  .meta.apauto{color:var(--gold);opacity:.85}
  .loadmore{align-self:center;margin:2px 0 12px;padding:6px 16px;border-radius:999px;font-size:12.5px;color:var(--ink2);background:var(--panel);border:1px solid var(--border2);cursor:pointer}
  .loadmore:hover{border-color:var(--aqua);color:var(--aqua)}
  .tool .appending{font-size:12px;color:var(--muted)}
  .tool .apresolved{margin-top:6px;font-size:12.5px;font-weight:600} .tool .apresolved.ok{color:var(--green2)} .tool .apresolved.no{color:var(--red)}
  .tool .chip{display:inline-flex;align-items:center;gap:7px;color:var(--ink2);font-size:12.5px}
  .tool .chip b{color:var(--aqua)} .tool.denied .chip b{color:var(--red)}
  .tool .chip code{font-family:"SF Mono",Menlo,monospace;font-size:11.5px}
  .meta{font-size:11px;color:var(--muted);align-self:center;padding:2px 0}
  /* 结果面板右上角操作按钮（复制/分享/点赞/差评）：仅图标 + 原生 tooltip */
  .tool .tcacts{display:inline-flex;align-items:center;gap:1px;flex:0 0 auto}
  .tool .tcact{display:inline-flex;align-items:center;justify-content:center;width:24px;height:22px;border-radius:6px;color:var(--muted);background:transparent;border:1px solid transparent;cursor:pointer;padding:0;transition:color .12s,background .12s}
  .tool .tcact:hover{background:var(--hover);color:var(--ink)}
  .tool .tcact svg{display:block;width:15px;height:15px}
  .tool .tcact.liked{color:var(--aqua)} .tool .tcact.disliked{color:var(--red)}
  /* 结果状态图标（替代 exit 文字）：成功绿 / 失败红 */
  .tool .tcstatus{display:inline-flex;align-items:center} .tool .tcstatus svg{width:15px;height:15px;display:block}
  .tool .tcstatus.ok{color:var(--green)} .tool .tcstatus.bad{color:var(--red)}
  /* AI 文本气泡底部操作行 */
  .bubble .tcacts.bubble-acts{display:flex;gap:1px;margin:8px -4px -2px;padding-top:2px}
  .bubble .tcact{display:inline-flex;align-items:center;justify-content:center;width:24px;height:22px;border-radius:6px;color:var(--muted);background:transparent;border:1px solid transparent;cursor:pointer;padding:0;transition:color .12s,background .12s}
  .bubble .tcact:hover{background:var(--hover);color:var(--ink)} .bubble .tcact svg{display:block;width:15px;height:15px}
  .bubble .tcact.liked{color:var(--aqua)} .bubble .tcact.disliked{color:var(--red)}
  .cmx-toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(8px);background:var(--panel);color:var(--ink);
    border:1px solid var(--border2);border-radius:10px;padding:8px 16px;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:9999}
  .cmx-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 打字指示器：AI 气泡里三个跳动圆点 */
  .bubble.typing{display:inline-flex;align-items:center;gap:5px;padding:13px 16px}
  .bubble.typing .dot{width:7px;height:7px;border-radius:50%;background:var(--aqua);opacity:.4;animation:typing 1.2s infinite ease-in-out}
  .bubble.typing .dot:nth-child(2){animation-delay:.18s} .bubble.typing .dot:nth-child(3){animation-delay:.36s}
  @keyframes typing{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
  .chatfoot{padding:14px 26px 20px;border-top:1px solid var(--border);background:var(--bg)}
  .chatfoot .composer{max-width:900px;margin:0 auto}
  /* 会话输入框：更大、更专业 */
  .chat-composer{padding:14px 16px 12px;border-radius:18px;transition:border-color .15s,box-shadow .15s}
  .chat-composer:focus-within{border-color:var(--aqua);box-shadow:0 0 0 3px rgba(31,177,130,.18)}
  .inp2,#inp2{width:100%;background:none;border:none;outline:none;color:var(--ink);font-size:15px;line-height:1.55;
    resize:none;font-family:inherit;min-height:26px;max-height:200px;overflow-y:auto}
  .inp2::placeholder,#inp2::placeholder{color:var(--muted)}
  .chat-composer .crow{display:flex;align-items:center;height:32px;margin-top:8px;padding-top:8px;gap:6px;border-top:1px solid var(--border)}
  .tool-ic{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;
    color:var(--ink2);font-size:14px;background:transparent;border:1px solid transparent}
  .tool-ic:hover{background:var(--hover);color:var(--ink)}
  .tool-ic.voice.recording{color:#fff;background:var(--red);border-color:var(--red);animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .chat-composer .model{display:flex;align-items:center;gap:5px;height:28px;color:var(--ink2);font-size:12.5px;padding:0 10px;border-radius:8px;border:1px solid var(--border)}
  .chat-composer .model:hover{background:var(--hover);color:var(--ink)}
  .chat-composer .sp{flex:1}
  .chat-composer .send{width:30px;height:30px;border-radius:9px;background:var(--aqua);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;margin-left:2px}
  .chat-composer .send:hover{filter:brightness(1.1)} .chat-composer .send:disabled{opacity:.35;cursor:default}

  /* 连接器面板 */
  .connectors-view{flex:1;display:flex;flex-direction:column;min-height:0}
  .conn-toolbar{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--border)}
  .conn-toolbar .ct{font-weight:600;font-size:14px} .conn-toolbar .cm{color:var(--muted);font-size:12px}
  .conn-toolbar .back{color:var(--ink2);font-size:13px;padding:5px 9px;border-radius:7px} .conn-toolbar .back:hover{background:var(--hover)}
  .connlist{flex:1;overflow:auto;padding:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-content:start}

  /* 插件 master-detail：列表在侧栏（原位置），详情在主内容区 tab（VSCode 式） */
  .pg-search{display:flex;gap:6px;padding:2px 0 10px}
  .pg-search input{flex:1;background:var(--surface);border:1px solid var(--border2);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:12.5px;outline:none}
  .pg-search input:focus{border-color:var(--aqua)}
  .pg-refresh{flex:0 0 auto;background:var(--surface);border:1px solid var(--border2);color:var(--ink2);border-radius:8px;padding:0 10px;cursor:pointer}
  .pg-refresh:hover{background:var(--hover)}
  .pg-list{flex:1;overflow:auto;margin:0 -4px}
  .pg-sec{font-size:11px;font-weight:700;color:var(--muted);padding:12px 8px 5px;letter-spacing:.5px}
  .pg-hint,.pg-loading{color:var(--muted);font-size:12px;padding:8px 10px}
  .pg-item.sel{background:var(--accent-soft)}
  .pg-item.sel .pn{color:var(--aqua)}
  /* 详情（主内容区 tab） */
  .plugins-detail-view{flex:1;display:flex;flex-direction:column;min-height:0}
  .pg-detail{flex:1;min-width:0;overflow:auto;background:var(--bg)}
  .pg-empty{color:var(--muted);font-size:13px;padding:40px 30px;text-align:center}
  .pg-empty.sm{padding:16px;text-align:left}
  .pg-detail-inner{padding:0 0 30px}
  .pg-topbar{height:3px;background:var(--muted)}
  .pg-detail-inner.is-installed .pg-topbar{background:var(--aqua)}
  .pg-head{display:flex;gap:16px;padding:22px 26px 12px}
  .pg-ico{width:64px;height:64px;flex:0 0 64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff}
  .pg-h-main{min-width:0;flex:1}
  .pg-title{font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pg-sub{color:var(--muted);font-size:12.5px;margin-top:4px}
  .pg-desc{color:var(--ink2);font-size:13.5px;margin-top:8px;line-height:1.5}
  .pg-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid}
  .pg-badge.installed{color:var(--aqua);border-color:var(--aqua);background:var(--accent-soft)}
  .pg-badge.disabled{color:var(--muted);border-color:var(--muted)}
  .pg-badge.market{color:var(--muted);border-color:var(--border2)}
  .pg-item.pg-off .pic{filter:grayscale(1);opacity:.55} .pg-item.pg-off .pn{color:var(--muted)}
  .pg-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .pg-actbtn{font-size:12.5px;padding:6px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);color:var(--ink);cursor:pointer}
  .pg-actbtn:hover{background:var(--hover)}
  .pg-actbtn.primary{background:var(--aqua);border-color:var(--aqua);color:#fff}
  .pg-actbtn.primary:hover{filter:brightness(1.06)}
  .pg-actbtn.ghost{background:transparent;color:var(--ink2)}
  .pg-actbtn.danger{background:var(--red);border-color:var(--red);color:#fff}
  .pg-actbtn:disabled{opacity:.6;cursor:default}
  .pg-sec-h{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.5px;padding:16px 26px 8px;border-top:1px solid var(--border);margin-top:14px}
  .pg-chips{display:flex;flex-wrap:wrap;gap:7px;padding:2px 26px 4px}
  .pg-chip{font-size:11.5px;padding:4px 10px;border-radius:7px;background:var(--surface);border:1px solid var(--border2);color:var(--ink2)}
  .pg-chip.perm{color:var(--violet);border-color:var(--violet)}
  .pg-chip.warn{color:var(--orange);border-color:var(--orange)}
  .pg-kvs{padding:6px 26px}
  .pg-kv{display:flex;gap:10px;font-size:12.5px;padding:3px 0}
  .pg-kv .k{flex:0 0 90px;color:var(--muted)} .pg-kv .v{color:var(--ink2);word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .pg-frame-bar{padding:4px 26px 8px;font-size:12px;color:var(--muted)}
  .pg-link{color:var(--blue);cursor:pointer;text-decoration:underline;word-break:break-all}
  .pg-frame-hint{color:var(--muted);margin-left:6px}
  .pg-frame{display:block;width:calc(100% - 52px);height:60vh;margin:0 26px;border:1px solid var(--border2);border-radius:10px;background:#fff}
  .empty-detail{text-align:center;max-width:420px}
  .empty-detail .ed-ico{font-size:52px;margin-bottom:14px;opacity:.9}
  .empty-detail .ed-t{font-size:20px;font-weight:700;margin-bottom:10px}
  .empty-detail .ed-d{font-size:14px;color:var(--ink2);line-height:1.9}
  .empty-detail .ed-note{margin-top:18px;font-size:12px;color:var(--muted)}
  #connlist{flex:1;overflow:auto;padding:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-content:start}
  .conn{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
  .conn.offline{opacity:.62}
  .conn .ch{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .conn .ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;flex:0 0 36px}
  .conn.flow .ico{background:var(--blue)} .conn.onto .ico{background:var(--violet)} .conn.report .ico{background:var(--orange)}
  .conn .cn{font-weight:700;font-size:15px} .conn .cs{font-size:12px;color:var(--muted)}
  .conn .dot{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
  .conn .dot.on{color:var(--aqua)} .conn .dot.off{color:var(--muted)}
  .conn .dot .b{width:8px;height:8px;border-radius:50%}
  .conn .dot.on .b{background:var(--aqua)} .conn .dot.off .b{background:var(--muted)}
  .conn .desc{font-size:13px;color:var(--ink2);line-height:1.5;margin-bottom:12px}
  .conn .tools{display:flex;flex-wrap:wrap;gap:7px}
  .conn .tchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border2);border-radius:8px;padding:6px 11px;font-size:12px;color:var(--ink2);cursor:pointer;font-family:"SF Mono",Menlo,monospace}
  .conn .tchip:hover{background:var(--hover);color:var(--ink);border-color:var(--aqua)}
  .conn.offline .tchip{cursor:not-allowed;opacity:.7}
  .conn .meta{font-size:11px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
  <!-- ═════ 原生标题条 ═════
       macOS：与系统交通灯同一行（Overlay，titleBarStyle 由 tauri.conf.json 配），左留 82px 交通灯位。
       Windows/Linux：系统装饰关闭（tauri.windows.conf.json / tauri.linux.conf.json 的 decorations:false），
       无交通灯可借，标题条改左对齐 + 右侧补最小化/最大化/关闭按钮（win-ctrls，initPlatformChrome 按平台显隐）。
       data-tauri-drag-region：Tauri 原生拖动；按钮不带该属性故可点。 -->
  <div class="titlebar" data-tauri-drag-region>
    <span class="tb-title" data-tauri-drag-region>cmx 企业桌面智能体</span>
    <div class="sp" data-tauri-drag-region></div>
    <div class="tb-ctrls">
      <button class="tb-btn" data-act="toggleSidebar" title="隐藏/显示左侧栏"><span class="ico" id="tb-side-ico">⇤</span></button>
      <button class="tb-btn" data-act="toggleTheme" title="浅色/深色主题"><span class="ico" id="tb-theme-ico">☀</span></button>
      <button class="tb-btn tb-update" id="tb-update-btn" data-act="applyUpdate" title="安装更新" style="display:none"><span class="ico">⭮</span><span id="tb-update-label">更新</span></button>
    </div>
    <!-- Windows/Linux 专用窗口控件（无 data-tauri-drag-region，可点；默认隐藏，由 initPlatformChrome 探测非 macOS 后显示） -->
    <div class="win-ctrls" id="win-ctrls" style="display:none">
      <button class="win-btn" data-act="winMinimize" title="最小化"><span class="ico">─</span></button>
      <button class="win-btn" id="win-max-btn" data-act="winToggleMaximize" title="最大化"><span class="ico">□</span></button>
      <button class="win-btn win-close" data-act="winClose" title="关闭"><span class="ico">✕</span></button>
    </div>
  </div>
  <!-- Windows/Linux 无系统边框缩放热区：四边 + 四角不可见拖拽条（macOS 用系统边框，initPlatformChrome 隐藏这些） -->
  <div class="resize-handle rh-t" data-resize="North"></div>
  <div class="resize-handle rh-b" data-resize="South"></div>
  <div class="resize-handle rh-l" data-resize="West"></div>
  <div class="resize-handle rh-r" data-resize="East"></div>
  <div class="resize-handle rh-tl" data-resize="NorthWest"></div>
  <div class="resize-handle rh-tr" data-resize="NorthEast"></div>
  <div class="resize-handle rh-bl" data-resize="SouthWest"></div>
  <div class="resize-handle rh-br" data-resize="SouthEast"></div>
  <div class="workspace">
  <!-- ═════ 最左活动栏（VSCode 式）═════ -->
  <div class="activitybar">
    <div class="act active" id="act-agent" data-act="showPanel" data-panel="agent" title="Agent"><span>🤖</span></div>
    <div class="act" id="act-im" data-act="showPanel" data-panel="im" title="即时通讯"><span>💬</span><span class="badge">3</span></div>
    <div class="act" id="act-plugins" data-act="showPanel" data-panel="plugins" title="插件管理"><span>🧩</span></div>
    <div class="act-sp"></div>
    <button class="act user-act" id="user-act-btn" data-act="toggleUserMenu" title="未登录"><span class="uic" id="uic">👤</span></button>
    <button class="act cmx-act" data-act="toggleMenu" title="设置 · 关于 · 更多"><img src="cmx.png" alt="cmx" /></button>
  </div>
  <!-- ═════ 左侧栏（三面板切换）═════ -->
  <aside>
    <!-- Agent 面板（默认）：现有会话功能 -->
    <div class="panel agent-panel on" id="panel-agent">
    <div class="brand"><span class="uname">Agent</span><span class="v" id="ver">M1</span></div>
    <button class="newbtn" data-act="newTask"><span class="plus">⊕</span> 新建任务</button>
    <nav>
      <!-- 占位导航：M2+ 逐个接真实功能 -->
      <div class="navitem" title="占位"><span class="i">🅐</span> 助理</div>
      <div class="navitem" title="占位"><span class="i">▦</span> 项目</div>
      <div class="navitem" id="nav-connectors" data-act="openConnectors"><span class="i">🧩</span> 专家·技能·连接器 <span class="tag" id="conn-badge"></span></div>
      <div class="navitem" title="占位"><span class="i">⚙</span> 自动化</div>
      <div class="navitem" title="占位"><span class="i">⋯</span> 更多 <span class="tag">资料库·灵感</span></div>
    </nav>
    <div class="seclabel">任务 <span class="c" id="taskcount">(0)</span></div>
    <div class="tasklist" id="tasklist"></div>
    </div>

    <!-- 即时通讯面板（Telegram 式会话列表）-->
    <div class="panel im-panel" id="panel-im">
      <div class="brand"><span class="uname">即时通讯</span></div>
      <div class="im-search"><input type="text" placeholder="🔍 搜索联系人 / 群组" /></div>
      <div class="im-list" id="im-list"></div>
    </div>

    <!-- 插件管理面板（VSCode 式）-->
    <div class="panel plugins-panel" id="panel-plugins">
      <div class="brand"><span class="uname">插件管理</span></div>
      <div class="pg-search"><input type="text" id="pg-search-input" placeholder="🔍 搜索已安装 / 市场插件" /><button class="pg-refresh" id="pg-refresh" title="刷新">⟳</button></div>
      <div class="pg-list" id="pg-list"></div>
    </div>
  </aside>
  <!-- 左右分栏拖动条：拖动调整左侧栏宽度（宽度存 localStorage）-->
  <div class="splitter" id="splitter" title="拖动调整左侧栏宽度"></div>
  <!-- cmx 功能菜单（点活动栏底部 cmx 图标弹出，点外部关闭）。锚在活动栏底部左下角。-->
  <div class="cmxmenu" id="cmxmenu">
    <div class="mi" data-act="menuSettings"><span class="mi-i">⚙</span> 设置</div>
    <div class="mi" data-act="toggleTheme"><span class="mi-i">☀</span> 切换主题</div>
    <div class="mi" data-act="checkUpdate"><span class="mi-i">⭮</span> 检查更新</div>
    <div class="mi-sep"></div>
    <div class="mi" data-act="menuAbout"><span class="mi-i">ⓘ</span> 关于 cmx 智能体</div>
  </div>
  <!-- 模型选择弹层（点 composer 的 ◎ 模型按钮弹出；锚在按钮上方，点外部关闭）。 -->
  <div class="cmxmenu modelmenu" id="modelmenu"></div>
  <!-- 模型配置面板（Modal）：可视化配置 base_url / api_key / model / temperature / timeout_ms -->
  <div class="mcfg-overlay hidden" id="mcfg-overlay" onclick="if(event.target===this)closeModelConfig()">
    <div class="mcfg-box">
      <div class="mcfg-head">⚙ 模型配置 <button onclick="closeModelConfig()">✕</button></div>
      <div class="mcfg-row">
        <label>预设 Provider</label>
        <select id="mcfg-preset" onchange="mcfgApplyPreset(this.value)">
          <option value="">自定义</option>
          <option value="mlamp">MLamp（llmgw-bz.mlamp.cn/v1）</option>
          <option value="deepseek">DeepSeek（api.deepseek.com/v1）</option>
          <option value="openai">OpenAI（api.openai.com/v1）</option>
        </select>
      </div>
      <div class="mcfg-row">
        <label>Base URL</label>
        <input id="mcfg-base-url" type="text" placeholder="https://api.xxx.com/v1" oninput="mcfgRefreshCandidates()">
      </div>
      <div class="mcfg-row">
        <label>API Key</label>
        <div class="mcfg-key-wrap">
          <input id="mcfg-api-key" type="password" placeholder="（脱敏；点 🔓 解锁编辑）" readonly>
          <button id="mcfg-key-lock-btn" onclick="mcfgToggleKeyLock()" title="解锁/锁定 API Key">🔒</button>
        </div>
      </div>
      <div class="mcfg-row">
        <label>模型</label>
        <input id="mcfg-model" type="text" list="mcfg-model-list" placeholder="如 mlamp/deepseek-v4-flash">
        <datalist id="mcfg-model-list"></datalist>
      </div>
      <div class="mcfg-row">
        <label>Temperature</label>
        <div class="mcfg-temp-row">
          <input id="mcfg-temp" type="range" min="0" max="1" step="0.01" value="0.2"
            oninput="document.getElementById('mcfg-temp-val').textContent=parseFloat(this.value).toFixed(2)">
          <span class="mcfg-temp-val" id="mcfg-temp-val">0.20</span>
        </div>
      </div>
      <div class="mcfg-row">
        <label>超时 (ms)</label>
        <input id="mcfg-timeout" type="number" min="5000" max="300000" step="1000" value="60000">
      </div>
      <div class="mcfg-actions">
        <button onclick="closeModelConfig()">取消</button>
        <button class="mcfg-save" onclick="saveModelConfig()">保存</button>
      </div>
    </div>
  </div>
  <!-- 设置面板（Modal）：IM 遥控连接配置（飞书/Telegram 凭证 → 后端 im.json；重启生效）。
       复用模型面板的 mcfg-* 样式；交互走 data-act 委托（内联 onclick 被两壳 CSP 拦截，勿用）；
       密文走「锁」交互（面板只回显掩码，解锁才能改，保存 keep/set 语义同 API Key）。 -->
  <div class="mcfg-overlay hidden" id="settings-overlay">
    <div class="mcfg-box">
      <div class="mcfg-head">⚙ 设置 <button data-act="closeSettings">✕</button></div>
      <div class="mcfg-row">
        <label>IM 遥控</label>
        <div class="mcfg-temp-row">
          <select id="scfg-kind" style="flex:1">
            <option value="feishu">飞书 Feishu</option>
            <option value="telegram">Telegram</option>
          </select>
          <label style="display:flex;align-items:center;gap:5px;font-weight:400;font-size:12.5px;color:var(--ink2);white-space:nowrap">
            <input type="checkbox" id="scfg-enabled" checked> 启用
          </label>
        </div>
      </div>
      <div id="scfg-feishu-block">
        <div class="mcfg-row">
          <label>App ID</label>
          <input id="scfg-app-id" type="text" placeholder="cli_…（飞书开放平台 · 凭证与基础信息）">
        </div>
        <div class="mcfg-row">
          <label>App Secret</label>
          <div class="mcfg-key-wrap">
            <input id="scfg-app-secret" type="password" placeholder="（脱敏；点 🔓 解锁填写）" readonly>
            <button id="scfg-secret-lock" data-act="scfgSecretLock" title="解锁/锁定 App Secret">🔒</button>
          </div>
        </div>
        <div class="mcfg-row">
          <label>区域</label>
          <select id="scfg-base">
            <option value="">飞书 · 国内（open.feishu.cn）</option>
            <option value="https://open.larksuite.com">Lark · 海外（open.larksuite.com）</option>
          </select>
        </div>
      </div>
      <div id="scfg-telegram-block" style="display:none">
        <div class="mcfg-row">
          <label>Bot Token</label>
          <div class="mcfg-key-wrap">
            <input id="scfg-tg-token" type="password" placeholder="（脱敏；点 🔓 解锁填写）" readonly>
            <button id="scfg-tg-lock" data-act="scfgTgLock" title="解锁/锁定 Bot Token">🔒</button>
          </div>
        </div>
      </div>
      <div class="mcfg-row">
        <label>会话白名单（chat_id，可选）</label>
        <input id="scfg-allow" type="text" placeholder="留空 = 仅已绑定用户可对话（推荐）">
      </div>
      <div id="scfg-note" style="font-size:11.5px;color:var(--muted);margin:2px 0 6px;line-height:1.5"></div>
      <div class="mcfg-actions">
        <button data-act="closeSettings">取消</button>
        <button id="scfg-test-btn" data-act="imcfgTest">测试连接</button>
        <button class="mcfg-save" data-act="imcfgSave">保存</button>
      </div>
    </div>
  </div>
  <!-- 用户菜单（点活动栏底部用户头像弹出）：用户信息 + 常用功能 -->
  <div class="cmxmenu usermenu" id="usermenu">    <div class="um-head">
      <div class="um-av" id="um-av">🐷</div>
      <div class="um-info"><div class="um-name" id="um-name">未登录</div><div class="um-mail" id="um-mail">点此登录 cmx 门户</div></div>
    </div>
    <div class="mi-sep"></div>
    <div class="mi" data-act="userProfile"><span class="mi-i">👤</span> 账户信息</div>
    <div class="mi" data-act="imBinding"><span class="mi-i">🔗</span> IM 绑定（飞书）</div>
    <div class="mi" data-act="userSwitch"><span class="mi-i">⇄</span> 切换账户</div>
    <div class="mi" data-act="userWorkspace"><span class="mi-i">🗂</span> 工作空间</div>
    <div class="mi-sep"></div>
    <div class="mi um-danger" data-act="userLogout"><span class="mi-i">⎋</span> 退出登录</div>
  </div>

  <!-- ═════ 主区 ═════ -->
  <main>
    <!-- 顶部多 tab 条：打开的功能各占一个可关闭 tab；溢出下拉；右键上下文菜单 -->
    <div class="tabbar" id="tabbar">
      <div class="tabstrip" id="tabstrip"></div>
      <button class="tab-overflow" id="tab-overflow" data-act="toggleTabOverflow" title="打开的标签页">⌄</button>
    </div>
    <!-- tab 溢出下拉 -->
    <div class="tab-dropdown" id="tab-dropdown"></div>

    <!-- 空态默认内容（无任何 tab 时显示，就像首页）-->
    <section id="home">
      <div class="hero"><span class="g">cmx</span>，我帮你</div>
      <div class="cats">
        <div class="cat active">☕ 日常办公</div>
        <div class="cat" title="占位">⌨ 代码开发</div>
        <div class="cat" title="占位">🎨 设计创意</div>
      </div>
      <div class="quick" id="quick"></div>
      <div class="composer chat-composer">
        <textarea id="inp" placeholder="今天帮你做些什么？  @ 引用文件 · / 调用技能 · ⏎ 发送 · ⇧⏎ 换行" rows="1"></textarea>
        <div class="crow">
          <button class="tool-ic" title="附件（占位）"><span>＋</span></button>
          <button class="tool-ic" title="引用文件（占位）"><span>@</span></button>
          <button class="tool-ic" title="调用技能（占位）"><span>/</span></button>
          <div class="sp"></div>
          <button class="model" data-act="openModelMenu" title="模型选择"><span class="mdot">◎</span> <span class="mlabel">Auto</span> ▾</button>
          <button class="tool-ic voice" data-act="toggleVoice" title="语音输入（占位）"><span>🎙</span></button>
          <button class="send" id="homesend" data-act="startFromHome" title="发送 ⏎"><span>↑</span></button>
        </div>
      </div>
      <div class="selectors">
        <div class="selbtn">🗂
          <select id="workspace" title="工作空间 = 沙箱工作区根">
            <option value="default">选择工作空间：默认工作区</option>
            <option value="docs">文档工作区</option>
          </select>
        </div>
        <div class="selbtn">🛡
          <select id="perm" title="默认权限 = 两旋钮：沙箱能力 × 审批许可">
            <option value="workspace-write/on-request">默认权限：工作区可写 · 按需审批</option>
            <option value="read-only/on-request">只读 · 按需审批</option>
            <option value="danger-full-access/never">完全访问 · 从不打断（危险）</option>
          </select>
        </div>
      </div>
    </section>

    <!-- 每个 tab 的内容 DOM 挂这里（各自独立、保留状态；只 active 的显示）-->
    <div id="tabviews"></div>

    <!-- 会话内容模板：每个会话 tab 克隆一份，独立 log + composer -->
    <template id="tpl-session">
      <div class="session-view">
        <div class="log"></div>
        <div class="chatfoot">
          <div class="composer chat-composer">
            <textarea class="inp2" placeholder="继续对话…  @ 引用文件 · / 调用技能 · ⏎ 发送 · ⇧⏎ 换行" rows="1"></textarea>
            <div class="crow">
              <button class="tool-ic" title="附件（占位）"><span>＋</span></button>
              <button class="tool-ic" title="引用文件（占位）"><span>@</span></button>
              <button class="tool-ic" title="调用技能（占位）"><span>/</span></button>
              <div class="sp"></div>
              <button class="model" data-act="openModelMenu" title="模型选择"><span class="mdot">◎</span> <span class="mlabel">Auto</span> ▾</button>
              <button class="tool-ic voice" data-act="toggleVoice" title="语音输入（占位）"><span>🎙</span></button>
              <button class="send tab-send" title="发送 ⏎"><span>↑</span></button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- 连接器内容模板 -->
    <template id="tpl-connectors">
      <div class="connectors-view">
        <div class="conn-toolbar"><span class="ct">专家 · 技能 · 连接器</span><span class="cm">把运行中的 cmx 引擎接成智能体的工具</span><div class="sp" style="flex:1"></div><button class="back tab-conn-refresh">⟳ 刷新</button></div>
        <div class="connlist"></div>
      </div>
    </template>
    <template id="tpl-plugins">
      <div class="plugins-detail-view">
        <div class="pg-detail"><div class="pg-empty">← 在左侧插件列表中选择一个插件查看详情</div></div>
      </div>
    </template>
  </main>
  </div>

  <!-- tab 右键上下文菜单 -->
  <div class="cmxmenu tabctx" id="tabctx">
    <div class="mi" data-act="tabCtxClose"><span class="mi-i">✕</span> 关闭</div>
    <div class="mi" data-act="tabCtxCloseOthers"><span class="mi-i">⊘</span> 关闭其他</div>
    <div class="mi" data-act="tabCtxCloseRight"><span class="mi-i">→</span> 关闭右侧</div>
    <div class="mi-sep"></div>
    <div class="mi" data-act="tabCtxCloseAll"><span class="mi-i">⊗</span> 全部关闭</div>
  </div>

<script>
// ── 后端桥：同核多壳。原生 Tauri 壳走 invoke("agent")，Web 壳回退 HTTP POST /api。两者同达 dispatch_json。 ──
async function call(req){
  if (window.__TAURI__ && window.__TAURI__.core){
    const raw = await window.__TAURI__.core.invoke("agent", { payload: JSON.stringify(req) });
    return JSON.parse(raw);
  }
  const r = await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(req)});
  return await r.json();
}
// ── 默认权限（两旋钮）：🛡 下拉切换沙箱能力 × 审批许可（前门 set_policy，立即生效）。
// 选择记在 localStorage，启动时恢复（后端默认 workspace-write/on-request，由前端补投上次选择）──
document.addEventListener('change', async e => {
  const sel = e.target;
  if (!sel || sel.id !== 'perm') return;
  const [sandbox, approval] = sel.value.split('/');
  try { localStorage.setItem('cmx-perm', sel.value); } catch (_) {}
  const r = await call({cmd:'set_policy', sandbox, approval});
  if (!r || r.ok === false) alert('切换权限失败：' + (r && r.error ? r.error.message : '未知错误'));
});
(function restorePerm(){
  const sel = document.getElementById('perm');
  let saved = null;
  try { saved = localStorage.getItem('cmx-perm'); } catch (_) {}
  if (!sel || !saved || ![...sel.options].some(o => o.value === saved)) return;
  sel.value = saved;
  const [sandbox, approval] = saved.split('/');
  call({cmd:'set_policy', sandbox, approval}).then(r => {
    if (!r || r.ok === false) console.warn('恢复权限档失败', r);
  });
})();
// ── 流式对话桥（同核多壳）：原生 Tauri 壳走 invoke("send_stream")+事件；Web 壳走 POST /api/stream 的 SSE。──
// onEvent 收到每个会话事件（含终止标记 {kind:"stream_done"} / {kind:"stream_error",message}）。
async function streamSend(sessionId, text, onEvent){
  if (window.__TAURI__ && window.__TAURI__.core){
    STREAMING.add(sessionId);   // 标记本地流式中 → session_event 监听跳过，避免双重渲染
    const chan = "agentstream-" + Date.now() + "-" + Math.random().toString(36).slice(2,8);
    const un = await window.__TAURI__.event.listen(chan, e => onEvent(e.payload));
    try { await window.__TAURI__.core.invoke("send_stream", { sessionId, text, channel: chan }); }
    finally { un(); STREAMING.delete(sessionId); }
    return;
  }
  // Web：fetch + ReadableStream 手动解析 SSE（\n\n 分帧，取 data: 行）
  const r = await fetch("/api/stream", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({session_id:sessionId, text})});
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
  while(true){
    const {value, done} = await reader.read(); if(done) break;
    buf += dec.decode(value, {stream:true});
    let idx;
    while((idx = buf.indexOf("\n\n")) >= 0){
      const frame = buf.slice(0, idx); buf = buf.slice(idx+2);
      const dline = frame.split("\n").find(l => l.startsWith("data:"));
      if(!dline) continue;
      try { onEvent(JSON.parse(dline.slice(5).trim())); } catch(e){}
    }
  }
}
function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function el(cls,html){ const d=document.createElement("div"); d.className=cls; if(html!=null)d.innerHTML=html; return d; }

// ══════════════ 多 tab 系统 ══════════════
// 每个 tab 保留独立 DOM 状态（像浏览器）。TABS 里存 {id,kind,title,ico,view,extra}
// kind: "session"（会话，view 含独立 log+composer）/ "connectors"（连接器卡片）
let TABS = [];
let ACTIVE = null;      // 当前 active tab 的 id
let CURRENT = null;     // 当前 active 的会话 id（供任务列表高亮/发送；非会话 tab 时为 null）
// 本地正在流式的会话 id 集合。全局 session_event 监听据此跳过本地回合，避免与 streamSend 双重渲染。
// IM 来源会话永不在其中 → 走 session_event 实时通道。
let STREAMING = new Set();
const tabviews = ()=>document.getElementById("tabviews");
const homeEl = ()=>document.getElementById("home");

function findTab(id){ return TABS.find(t=>t.id===id); }

// 渲染顶部 tab 条
function renderTabs(){
  const strip=document.getElementById("tabstrip"); strip.innerHTML="";
  TABS.forEach(t=>{
    const el=document.createElement("div");
    el.className="tab"+(t.id===ACTIVE?" active":"");
    el.dataset.tabid=t.id;
    el.innerHTML=`<span class="tab-ico">${t.ico}</span><span class="tab-t">${esc(t.title)}</span><span class="tab-x" title="关闭">✕</span>`;
    el.onclick=(e)=>{ if(e.target.classList.contains("tab-x")){ closeTab(t.id); } else { activateTab(t.id); } };
    el.oncontextmenu=(e)=>{ e.preventDefault(); openTabCtx(e, t.id); };
    strip.append(el);
  });
  // 显示逻辑：home(新建任务) 与 tabviews 按「是否有激活 tab」切换；tab 条只要有 tab 就显示。
  // 关键：ACTIVE==null 表示「新建任务」态——即使已有 tab，也显示 home 内容（tab 条仍在，便于切回）。
  const hasTabs=TABS.length>0;
  const inTab=ACTIVE!==null;
  homeEl().classList.toggle("off", inTab);
  tabviews().classList.toggle("on", inTab);
  document.getElementById("tabbar").style.display = hasTabs ? "" : "none";
}

// 激活某 tab：只显示它的 view
function activateTab(id){
  ACTIVE=id;
  TABS.forEach(t=>t.view.classList.toggle("active", t.id===id));
  const t=findTab(id);
  CURRENT = (t && t.kind==="session") ? t.sessionId : null;
  renderTabs();
  if(t && t.kind==="session"){ const inp=t.view.querySelector(".inp2"); if(inp) inp.focus(); }
}

// 打开或聚焦一个 tab
function openTab({id, kind, title, ico, sessionId}){
  let t=findTab(id);
  if(t){ activateTab(id); return t; }
  const view=document.createElement("div"); // 会被模板内容替换
  t={id, kind, title, ico, sessionId, view};
  TABS.push(t);
  tabviews().append(view);
  return t;
}

// 关闭一个 tab
function closeTab(id){
  const idx=TABS.findIndex(t=>t.id===id); if(idx<0) return;
  const t=TABS[idx]; t.view.remove(); TABS.splice(idx,1);
  if(ACTIVE===id){
    // 激活相邻 tab
    const next=TABS[idx] || TABS[idx-1];
    if(next) activateTab(next.id); else { ACTIVE=null; CURRENT=null; renderTabs(); document.getElementById("inp").focus(); }
  } else { renderTabs(); }
  refreshTasks();
}
function closeOthers(id){ TABS.filter(t=>t.id!==id).map(t=>t.id).forEach(closeTab); activateTab(id); }
function closeRight(id){ const idx=TABS.findIndex(t=>t.id===id); TABS.slice(idx+1).map(t=>t.id).forEach(closeTab); }
function closeAll(){ TABS.map(t=>t.id).forEach(closeTab); }

// tab 溢出下拉
function toggleTabOverflow(){
  const dd=document.getElementById("tab-dropdown");
  if(dd.classList.contains("on")){ dd.classList.remove("on"); return; }
  dd.innerHTML="";
  TABS.forEach(t=>{
    const it=el("tab-dd-item"+(t.id===ACTIVE?" active":""));
    it.innerHTML=`<span>${t.ico}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.title)}</span><span class="ddx">✕</span>`;
    it.onclick=(e)=>{ if(e.target.classList.contains("ddx")){ closeTab(t.id); toggleTabOverflow(); } else { activateTab(t.id); dd.classList.remove("on"); } };
    dd.append(it);
  });
  if(TABS.length===0) dd.append(el("tab-dd-item","（没有打开的标签页）"));
  dd.classList.add("on");
}

// tab 右键上下文菜单
let CTX_TAB=null;
function openTabCtx(e, id){
  CTX_TAB=id;

function tabCtxClose(){ closeTabCtx(); if(CTX_TAB) closeTab(CTX_TAB); }
function tabCtxCloseOthers(){ closeTabCtx(); if(CTX_TAB) closeOthers(CTX_TAB); }
function tabCtxCloseRight(){ closeTabCtx(); if(CTX_TAB) closeRight(CTX_TAB); }

// 快捷动作（点击=预填输入框）。占位示例，贴合 WorkBuddy 品类。

function ago(iso){ const d=(Date.now()-new Date(iso).getTime())/86400000;

// ── 轻量 Markdown 渲染（块级 + 行内）：标题/列表/表格/代码块/引用/粗斜体/行内代码/链接 ──
// 安全：所有文本经 esc() 转义后再套标签，模型输出的原始 HTML 一律当文本（避免注入）。
function mdInline(t){
  return esc(t)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g,'<del>$1</del>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderMarkdown(src){
  if(!src) return "";
  const lines=String(src).replace(/\r\n/g,"\n").split("\n");
  const out=[]; let i=0;
  const isSpecial=(l)=> /^(#{1,6}\s|```|>\s?|\s*[-*+]\s|\s*\d+\.\s|(-{3,}|\*{3,}|_{3,})\s*$)/.test(l);
  while(i<lines.length){
    let line=lines[i];
    if(/^```/.test(line)){                                   // 代码块
      const buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++; out.push('<pre class="md-pre"><code>'+esc(buf.join("\n"))+'</code></pre>'); continue;
    }
    const h=line.match(/^(#{1,6})\s+(.*)$/);                 // 标题
    if(h){ const n=h[1].length; out.push(`<h${n} class="md-h">`+mdInline(h[2])+`</h${n}>`); i++; continue; }
    if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){ out.push('<hr class="md-hr">'); i++; continue; }  // 分隔线
    // 表格：本行含 | 且下一行是 |---| 分隔
    if(line.includes("|") && i+1<lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]) && lines[i+1].includes("-")){
      const row=(l)=> l.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
      const heads=row(line); i+=2; const body=[];
      while(i<lines.length && lines[i].includes("|") && lines[i].trim()!==""){ body.push(row(lines[i])); i++; }
      let tb='<table class="md-table"><thead><tr>'+heads.map(c=>'<th>'+mdInline(c)+'</th>').join("")+'</tr></thead><tbody>';
      for(const r of body){ tb+='<tr>'+r.map(c=>'<td>'+mdInline(c)+'</td>').join("")+'</tr>'; }
      out.push(tb+'</tbody></table>'); continue;
    }
    if(/^>\s?/.test(line)){                                  // 引用
      const buf=[]; while(i<lines.length && /^>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^>\s?/,"")); i++; }
      out.push('<blockquote class="md-quote">'+buf.map(mdInline).join("<br>")+'</blockquote>'); continue;
    }
    if(/^\s*[-*+]\s+/.test(line)){                           // 无序列表
      const buf=[]; while(i<lines.length && /^\s*[-*+]\s+/.test(lines[i])){ buf.push('<li>'+mdInline(lines[i].replace(/^\s*[-*+]\s+/,""))+'</li>'); i++; }
      out.push('<ul class="md-ul">'+buf.join("")+'</ul>'); continue;
    }
    if(/^\s*\d+\.\s+/.test(line)){                           // 有序列表
      const buf=[]; while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ buf.push('<li>'+mdInline(lines[i].replace(/^\s*\d+\.\s+/,""))+'</li>'); i++; }
      out.push('<ol class="md-ol">'+buf.join("")+'</ol>'); continue;
    }
    if(line.trim()===""){ i++; continue; }
    const buf=[line]; i++;                                   // 段落（连续非空非特殊行，软换行→<br>）
    while(i<lines.length && lines[i].trim()!=="" && !isSpecial(lines[i]) &&
          !(lines[i].includes("|") && i+1<lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]))){ buf.push(lines[i]); i++; }
    out.push('<p class="md-p">'+buf.map(mdInline).join("<br>")+'</p>');
  }
  return out.join("");
}

// ── 工具卡片渲染：bash/run_tests 显示终端块；write/edit 显示内容；其余紧凑 JSON ──

// U5：红绿 diff 渲染。fs_edit 的 old→new 替换（各行加 -/+ 标记）。
function renderDiff(oldStr, newStr){
  let h='<pre class="tdiff">';
  for(const l of String(oldStr).split("\n")) h+=`<span class="dl del">- ${esc(l)}</span>`;
  for(const l of String(newStr).split("\n")) h+=`<span class="dl add">+ ${esc(l)}</span>`;
  return h+'</pre>';
}
// U5：Codex 风格补丁按行着色。
function renderPatch(txt){
  let h='<pre class="tdiff">';
  for(const raw of String(txt).split("\n")){
    let cls="ctx";
    if(raw.startsWith("+")) cls="add";
    else if(raw.startsWith("-")) cls="del";
    else if(raw.startsWith("@@")||raw.startsWith("***")) cls="hunk";
    h+=`<span class="dl ${cls}">${esc(raw)||" "}</span>`;
  }
  return h+'</pre>';
}
